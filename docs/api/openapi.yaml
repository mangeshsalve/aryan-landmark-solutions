        priority:
          $ref: '#/components/schemas/InquiryPriority'
        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string
        preferredCity:
          type: string
          description: BUYER matching preference — the city the buyer wants to purchase in.
        preferredPincode:
          type: string
          description: BUYER matching preference — the exact pincode the buyer wants to purchase in.
        maxBudget:
          type: number
          minimum: 0
