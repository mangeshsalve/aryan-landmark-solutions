        customerId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          nullable: true
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
          nullable: true
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
