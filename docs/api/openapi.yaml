        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string

    UpdateInquiryRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        type:
          type: string
        priority:
          $ref: '#/components/schemas/InquiryPriority'
