openapi: 3.0.3

info:
  title: Aryan Landmark Solutions API
  version: 1.0.0
  description: |
    Production REST API for Aryan Landmark Solutions.

    PostgreSQL contains six tables. All property photos, property documents
    and inquiry call recordings use one unified `attachments` resource.

    Cloudflare R2 stores file binaries. PostgreSQL stores metadata and the R2
    object key.

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Authentication
  - name: Master Authentication
  - name: Master Management
  - name: Users
  - name: Customers
  - name: Properties
  - name: Attachments
  - name: Inquiries
  - name: Inquiry Assignments
  - name: Follow-ups
  - name: Notifications
  - name: Public Properties
  - name: Reports
  - name: Sync

paths:

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login ADMIN or EMPLOYEE
      description: |
        `username` is users.user_id.

        CUSTOMER and MASTER cannot use this endpoint.

        Phase 36: rate-limited per source IP via the LOGIN_RATE_LIMITER
        Cloudflare binding, independent of MASTER login's own limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /master-auth/login:
    post:
      tags: [Master Authentication]
      summary: Login Master Record Management
      description: |
        MASTER is manually provisioned in the users table.
        There is no public master-registration endpoint.

        Phase 36: rate-limited per source IP via the
        MASTER_LOGIN_RATE_LIMITER Cloudflare binding, independent of
        application login's own limiter and configured more strictly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Master login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /master/users:
    get:
      tags: [Master Management]
      summary: List ADMIN/EMPLOYEE users (Master Admin user management)
      description: |
        Phase 15A. Same query semantics as GET /users (page, pageSize,
        role, status, search — all optional) reachable under the
        master-JWT boundary, so a MASTER account (which cannot hold an
        application JWT) can still list users for the Master Admin UI.
      security:
        - masterBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, EMPLOYEE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Master Management]
      summary: Create ADMIN or EMPLOYEE
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /master/users/{id}:
    patch:
      tags: [Master Management]
      summary: Edit an ADMIN/EMPLOYEE, incl. activate/deactivate and role change
      description: |
        Phase 15A. MASTER-only. Scoped to userType=APPLICATION_USER rows
        only — a MASTER can never edit its own or another MASTER's row,
        or any CUSTOMER row, through this endpoint. All fields optional
        (partial update). See UpdateApplicationUserRequest for the
        role/status take-effect-on-next-login caveat.
      security:
        - masterBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /master/customers:
    post:
      tags: [Master Management]
      summary: Create CUSTOMER master record
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users:
    get:
      tags: [Users]
      summary: List application users
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, EMPLOYEE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

  /users/{id}:
    patch:
      tags: [Users]
      summary: Change an employee's status (activate/deactivate/block)
      description: |
        Phase 35. ADMIN-only — an EMPLOYEE token gets 403 here, unlike
        GET /users above which both roles may call. Scoped to
        userType=APPLICATION_USER: a CUSTOMER or MASTER id, or an
        unknown id, both resolve to 404 USER_NOT_FOUND (never leaking
        which of those it was). The request body accepts `status` only
        — any other field (`role`, `email`, `password`, etc.) is
        rejected with 400, not silently ignored. This is a deliberately
        narrower sibling of PATCH /master/users/{id} (MASTER-only, can
        change far more fields) — ADMIN gets exactly the one capability
        this phase approved and nothing else.

        Takes effect immediately, not just on the target's next login:
        requireApplicationAuth re-checks `users.status` on every
        authenticated request, so a status other than ACTIVE ends that
        user's current session as soon as their device next reaches the
        backend (see LoginResponse's `expiresIn` description). A fully
        offline device cannot know about this until connectivity
        returns — this is expected, not a bug, and no maximum offline
        duration is enforced.
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Matches against name, mobile, or email
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'

    post:
      tags: [Customers]
      summary: Create customer
      description: |
        Creates a customer master record (users.user_type = CUSTOMER).
        Available to ADMIN and EMPLOYEE application users. createdBy is
        derived from the authenticated JWT, never accepted from the
        request body.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer details
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Customers]
      summary: Delete customer
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Blocked with 409
        if any inquiry references this customer
        (inquiries.customer_id is ON DELETE RESTRICT at the database
        level — this is not a new rule, it predates lightweight
        inquiries). A customer with no inquiries can always be deleted.
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Customer deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One or more inquiries reference this customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /properties:
    get:
      tags: [Properties]
      summary: List properties
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'

    post:
      tags: [Properties]
      summary: Create property
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}:
    get:
      tags: [Properties]
      summary: Get property
      description: |
        Phase 27. `data.attachments` is genuinely populated (one extra
        query for this single property — not a per-row cost, and
        GET /properties (list) deliberately still omits it, matching
        PropertyListResponse). Each attachment's `fileUrl` is not a
        usable link — the R2 bucket is private; use
        GET /attachments/{attachmentId}/download-url to obtain a
        short-lived viewing URL instead.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'

    patch:
      tags: [Properties]
      summary: Update property
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

    delete:
      tags: [Properties]
      summary: Delete property
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Never blocked by
        inquiries: inquiries.property_id is ON DELETE SET NULL at the
        database level (predates this phase), so any inquiry referencing
        this property simply loses that link and falls back to the same
        "no property yet" state a lightweight inquiry (Phase 13B) starts
        in — nothing breaks. Property-linked attachments are removed
        first, individually (including their R2 objects), through the
        same path DELETE /attachments/{attachmentId} uses.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '204':
          description: Property deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attachments/upload-url:
    post:
      tags: [Attachments]
      summary: Create a short-lived Cloudflare R2 upload authorization
      description: |
        Unified file upload endpoint.

        Use `attachmentType=PHOTO` for property or inquiry photos,
        `attachmentType=DOCUMENT` for 7/12 and other property/inquiry
        documents, `attachmentType=RECORDING` for inquiry call recordings.

        Relationship rules:
        - RECORDING: inquiryId required, propertyId must be absent.
        - PHOTO / DOCUMENT: exactly one of propertyId or inquiryId is
          required (never both). propertyId is the original property-photo
          flow; inquiryId supports the lightweight ADMIN-call-capture flow
          (Phase 13B) where photos/documents are gathered before a
          property record exists.

        The backend validates resource ownership/authorization and returns
        a short-lived upload URL and generated R2 object key.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachmentUploadRequest'
      responses:
        '200':
          description: R2 upload authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: File too large

  /attachments:
    post:
      tags: [Attachments]
      summary: Finalize an uploaded attachment
      description: |
        The client calls this endpoint after uploading the binary to R2.

        The backend verifies the expected object and creates one row in the
        `attachments` table. Same propertyId/inquiryId relationship rules
        as POST /attachments/upload-url.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAttachmentRequest'
      responses:
        '201':
          description: Attachment metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Attachments]
      summary: List attachments
      description: |
        Filter by propertyId, inquiryId and attachmentType.
      security:
        - applicationBearer: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
        - name: inquiryId
          in: query
          schema:
            type: string
            format: uuid
        - name: attachmentType
          in: query
          schema:
            $ref: '#/components/schemas/AttachmentType'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'

  /attachments/{attachmentId}/download-url:
    get:
      tags: [Attachments]
      summary: Get a short-lived, secure view/download URL for an attachment
      description: |
        Phase 27. The R2 bucket is private (no public r2.dev access, no
        public base URL) — this is the only supported way for an
        authenticated client to obtain a working URL for a photo,
        document, or recording. Verifies the attachment exists, resolves
        its object key from the stored `r2ObjectKey` (never from client
        input — there is no way to request an arbitrary object key
        through this endpoint), and returns a presigned GET URL valid for
        `expiresIn` seconds (300s — short, viewing-session-scoped, not
        meant to be cached or reused beyond one load/open action).
        Same authorization as every other attachment/property read
        (ADMIN or EMPLOYEE, no additional per-resource ownership check).
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: A short-lived presigned URL for viewing/downloading this attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownloadUrlResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Cloudflare R2 is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attachments/{attachmentId}:
    delete:
      tags: [Attachments]
      summary: Delete attachment
      description: |
        Deletes the attachment metadata and performs the corresponding
        authorized Cloudflare R2 object deletion.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries:
    get:
      tags: [Inquiries]
      summary: List inquiries
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/InquiryPriority'
        - name: assignedToUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: handledByUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'

    post:
      tags: [Inquiries]
      summary: Create inquiry
      description: |
        Creator is derived from the authenticated JWT.

        customerId/propertyId are optional (Phase 13B): an ADMIN taking a
        call can create a lightweight inquiry (customerId=null,
        propertyId=null, type=null, status=NEW) before either master
        record has been identified — see the inquiry-centric attachment
        capture flow below.

        ADMIN:
        At least one RECORDING attachment associated with this inquiry is
        required before submission (POST /inquiries/{inquiryId}/submit) is
        allowed. Since a RECORDING requires inquiryId, the inquiry must
        already exist — record it via POST /attachments/upload-url +
        POST /attachments against the created inquiryId, then assign an
        EMPLOYEE.

        EMPLOYEE:
        Recording is optional.

        The client must not send a creator role for authorization.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /inquiries/{inquiryId}:
    get:
      tags: [Inquiries]
      summary: Get inquiry details
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'

    patch:
      tags: [Inquiries]
      summary: Update inquiry
      description: |
        Phase 18A authorization: ADMIN may edit any inquiry. EMPLOYEE may
        edit only the inquiry currently assigned to them
        (inquiries.assigned_to_user_id = the caller's user id, checked
        live — never from assignment history), and is rejected with 403
        otherwise. Viewing (GET) is unaffected — this restriction applies
        to PATCH only.

        Reassigning via this endpoint (assignedToUserId different from
        the current value) also sets handledByUserId to the same user,
        records an inquiry_assignments history row, and — if the caller
        is an ADMIN — creates an in-app notification for the newly
        assigned employee, same as POST /inquiries/{inquiryId}/assign.
        Outside of a reassignment, handledByUserId may still be set
        independently.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInquiryRequest'
      responses:
        '200':
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '403':
          description: EMPLOYEE attempted to edit an inquiry not currently assigned to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Inquiries]
      summary: Delete inquiry
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Deletes the
        inquiry and, via ON DELETE CASCADE, its attachments, assignment
        history, and follow-ups. Attachment R2 objects are removed
        first, individually, through the same path DELETE
        /attachments/{attachmentId} uses, so no object is left behind in
        storage. A deleted inquiry's follow-ups are removed from the
        database entirely — they can never appear in
        GET /follow-ups/today afterward.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '204':
          description: Inquiry deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/submit:
    post:
      tags: [Inquiries]
      summary: Submit an inquiry
      description: |
        Submit an existing inquiry after validating that all mandatory
        requirements are satisfied.

        Sets inquiries.submitted_at to the current time. Fails with a
        conflict if the inquiry has already been submitted
        (submitted_at is already set).

        If the inquiry's creator (created_by) is an ADMIN, at least one
        RECORDING attachment for this inquiry is required, or the
        request is rejected. If the creator is an EMPLOYEE, the
        recording is optional. The creator's role is read from the
        inquiry's created_by user, not from the caller submitting it —
        an EMPLOYEE may submit an ADMIN-created inquiry and the ADMIN
        recording requirement still applies, and vice versa.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: ADMIN inquiry submitted without a required recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries/{inquiryId}/assign:
    post:
      tags: [Inquiry Assignments]
      summary: Assign or reassign inquiry
      description: |
        Updates inquiries.assigned_to_user_id AND
        inquiries.handled_by_user_id (Phase 18A — both point at the
        newly assigned user), and inserts an inquiry_assignments history
        row, in one database transaction.

        Phase 23A authorization: ADMIN may assign/reassign any inquiry.
        EMPLOYEE may assign/reassign only the inquiry currently assigned
        to them (inquiries.assigned_to_user_id = the caller's user id,
        checked live — never from assignment history), and is rejected
        with 403 otherwise — same rule as PATCH /inquiries/{inquiryId}.
        An unassigned inquiry (assigned_to_user_id = null) is therefore
        also not takeable by an EMPLOYEE through this endpoint.

        If the caller is an ADMIN, the newly assigned employee receives
        an in-app notification (GET /notifications). If the caller is an
        EMPLOYEE, no notification is created — the assignment itself
        still succeeds identically either way; this is purely an
        additive side effect, never a precondition.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInquiryRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '403':
          description: EMPLOYEE attempted to assign/reassign an inquiry not currently assigned to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries/{inquiryId}/assignments:
    get:
      tags: [Inquiry Assignments]
      summary: Get assignment history
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'

  /inquiries/{inquiryId}/matches:
    get:
      tags: [Inquiries]
      summary: Find matching inquiries (bidirectional)
      description: |
        Phase 11 buyer/property matching foundation; bidirectional as of
        Phase 19A; redesigned as a percentage-based, multi-dimension
        engine as of Phase 40B (replacing the old fixed-point 0-100
        `matchingScore` with per-dimension percentages plus an overall
        percentage). Which direction runs depends on the path inquiry's
        own type:

        - type=SELLER → returns matching BUYER inquiries.
        - type=BUYER → returns matching SELLER inquiries.
        - any other type (including a lightweight inquiry with type=null)
          → 400.

        **Location source is asymmetric by design, and this is a hard
        invariant, not an implementation detail**: a BUYER's location
        always comes from the BUYER inquiry's own city/state/pincode/
        locality; a SELLER's location always comes from its *linked
        Property's* city/state/pincode/locality — read live via a JOIN,
        never from the SELLER inquiry's own copied/synced fields (which
        exist for other purposes but can drift from the live property).
        **Customer/User profile address is never used for matching, in
        either direction** — only the customer's name/mobile are read,
        for display identity only.

        Seven independently-scored dimensions, each 0-100 or `null`
        ("not comparable for this candidate — excluded from the overall
        average, never counted as a failing 0"), with these weights:

          pincode      20%  — exact match after normalization.
          city         15%  — exact match after normalization.
          state         5%  — exact match after normalization.
          locality     10%  — token-overlap fuzzy match, short/numeric/
                               generic words filtered out.
          propertyType 15%  — exact match after trim+lowercase; the
                               BUYER's `desiredPropertyType` vs the
                               SELLER property's own `propertyType`
                               (still free text on both sides — no
                               fuzzy/synonym matching).
          area         15%  — BUYER's `desiredMinArea`/`desiredAreaUnit`
                               is a MINIMUM requirement, not an exact
                               target; both sides are converted to a
                               canonical square-feet unit before
                               comparison. A smaller available area
                               scores 0; an equal or larger one scores
                               `100 / (1 + log10(available/required))` —
                               100 at exact equality, smoothly
                               diminishing (never reaching 0) as the
                               surplus grows.
          budget       20%  — BUYER's minBudget/maxBudget range vs the
                               SELLER property's actual price. Within
                               range scores 100; above the maximum or
                               below the minimum scores a gradually
                               decreasing percentage (steeper above the
                               maximum than below the minimum). Only a
                               single price exists on the SELLER side —
                               no seller price range.

        `overallMatchPercentage` is the weighted average of only the
        non-null dimensions (their weights are excluded from the
        denominator, not treated as zero). A candidate is returned only
        if BOTH: (a) at least one of pincode/city/state/locality scores
        a genuine 100 (not merely non-null) — a candidate with zero real
        location alignment is never "a meaningful match" regardless of
        other dimensions — and (b) `overallMatchPercentage` is at least
        50 (an explicit, tunable threshold). Results are sorted by
        `overallMatchPercentage` descending. The source inquiry never
        appears in its own results.

        Status is NOT checked — a NEW, IN_PROGRESS, or COMPLETED inquiry
        may all use matching.

        Insufficient data: a SELLER inquiry with no propertyId is a 400
        (there is nothing to match against). A missing pincode/city/
        state/locality/propertyType/area/budget on either side simply
        excludes that one dimension from scoring — it no longer causes
        an empty result or an error the way a missing pincode used to
        (pincode is a scored dimension now, not a mandatory gate).
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Matching buyer inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryMatchListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/public:
    patch:
      tags: [Inquiries]
      summary: Change public visibility
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicVisibilityRequest'
      responses:
        '200':
          description: Updated inquiry

  /inquiries/{inquiryId}/follow-ups:
    get:
      tags: [Follow-ups]
      summary: List follow-ups for an inquiry
      description: |
        Phase 16A. Chronological (scheduledAt ascending) — matches the
        Inquiry Details screen's Follow-ups section.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Follow-ups for this inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Follow-ups]
      summary: Create a follow-up for an inquiry
      description: |
        Phase 16A. Works for a lightweight inquiry (customerId=null,
        propertyId=null, type=null) exactly the same as a fully completed
        one — a follow-up only ever requires the inquiry to exist.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFollowUpRequest'
      responses:
        '201':
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/follow-ups/{followUpId}:
    patch:
      tags: [Follow-ups]
      summary: Update a follow-up, incl. completing it
      description: |
        Phase 16A. All fields optional. Setting status=COMPLETED is how a
        follow-up is marked complete — there is no separate "complete"
        endpoint, since (unlike inquiry submission) there is no extra
        precondition to enforce.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/FollowUpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFollowUpRequest'
      responses:
        '200':
          description: Follow-up updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Follow-ups]
      summary: Delete a follow-up
      description: |
        Phase 22B. ADMIN and EMPLOYEE both allowed — same authorization as
        create/update above (no per-assignment ownership restriction).
        Hard delete: the follow_ups row is permanently removed. Before
        deletion, an audit_logs entry is written recording who deleted it,
        when, and a snapshot of the deleted follow-up's data (id,
        inquiryId, scheduledAt, status, notes, reminderEnabled) — both
        writes happen inside a single database transaction, so a follow-up
        is never deleted without its audit record, and an audit record
        never claims a deletion that didn't happen.

        followUpId must belong to the inquiry named in the path — a
        followUpId that exists but under a different inquiryId returns
        404, identical to a followUpId that doesn't exist at all.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/FollowUpId'
      responses:
        '204':
          description: Follow-up deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /follow-ups/today:
    get:
      tags: [Follow-ups]
      summary: Today's follow-ups (dashboard)
      description: |
        Phase 16A Part 6. "Today" is computed in the business's IST
        (Asia/Kolkata, UTC+5:30) timezone as a real UTC instant range, not
        a string comparison — see the backend's today-range.util.ts for
        the flagged assumption (no documented business timezone exists
        elsewhere in this project). Not paginated — "today" is a small,
        naturally bounded set. Each entry embeds a minimal Inquiry
        summary (id, inquiryNumber, status) and a minimal customer
        summary (id, name) which is null for a lightweight inquiry that
        has no customer yet.
      security:
        - applicationBearer: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FollowUpStatus'
      responses:
        '200':
          description: Follow-ups scheduled for today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayFollowUpListResponse'

  /notifications:
    get:
      tags: [Notifications]
      summary: List the caller's own notifications
      description: |
        Always scoped to the authenticated caller — there is no way to
        list another user's notifications. No POST: notifications are
        always created as a side effect of a real business action (e.g.
        an ADMIN assigning an inquiry), never directly by a client.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isRead
          in: query
          description: Filter to only read (true) or only unread (false) notifications.
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/{id}:
    patch:
      tags: [Notifications]
      summary: Update a notification (mark read/unread)
      description: |
        Scoped to the caller's own notifications — a notification id
        belonging to another user returns 404, never leaking whether it
        exists.
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/device-token:
    post:
      tags: [Notifications]
      summary: Register (or transfer) an FCM device token for push notifications
      description: |
        Phase 41C. `userId` is always taken from the authenticated JWT —
        never accepted in the request body. Upserts on `token`, which is
        globally unique across all users: registering a token already
        owned by a different application user transfers it to the
        caller (the same physical device may later be logged into by a
        different employee), refreshes `platform`/`lastUsedAt`, and sets
        it active again. The token itself is never echoed back in the
        response.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceTokenRequest'
      responses:
        '200':
          description: Token registered (or transferred) successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDeviceTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Notifications]
      summary: Deactivate one of the caller's own FCM device tokens
      description: |
        Phase 41C. Soft-deactivates (is_active=0) the given token, scoped
        to the caller's own tokens by user id — a token already
        transferred away to a different user (or never owned by the
        caller) is silently a no-op, never affecting another user's
        registration.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeregisterDeviceTokenRequest'
      responses:
        '200':
          description: Token deactivated (or was not the caller's — same response either way)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregisterDeviceTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /public/properties:
    get:
      tags: [Public Properties]
      summary: List publicly approved properties
      description: |
        Returns properties where isPublic=true AND status=AVAILABLE.
        isPublic alone is not sufficient — a property marked isPublic but
        no longer AVAILABLE (e.g. SOLD) is not returned. Unauthenticated.

        Phase 42B: photo `fileUrl` values are short-lived signed R2 GET
        URLs (same expiry as the staff-only download-url endpoint),
        minted fresh on every request — never rely on caching one beyond
        this response. The response shape is a dedicated public schema
        (`PublicProperty`, not the internal `Property` schema) — it never
        includes `ownerCustomerId`/`owner` or any other internal field.
        CORS is enabled for this route (GET only, any origin, no
        credentials); the response also carries a short
        `Cache-Control: public, max-age=60`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Public properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPropertyListResponse'

  /public/properties/{id}:
    get:
      tags: [Public Properties]
      summary: Get one publicly approved property
      description: |
        Phase 42B. Same visibility gate as GET /public/properties
        (isPublic=true AND status=AVAILABLE), applied directly in the
        lookup — a property that exists but isn't public/available
        returns the same 404 as a genuinely nonexistent id, never
        revealing which case it was. Unauthenticated. Same photo
        signed-URL behavior, CORS, and Cache-Control as the list
        endpoint above.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPropertyResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/properties/{propertyId}/inquiries:
    post:
      tags: [Public Properties]
      summary: Submit a property-specific inquiry ("I'm Interested")
      description: |
        Phase 45B. Unauthenticated. `type` is always BUYER — the request
        body has no `type` field, and one is rejected with a
        VALIDATION_ERROR if sent. Re-validates the same visibility gate
        as GET /public/properties/{id} (isPublic=true AND
        status=AVAILABLE) — a property that exists but isn't public/
        available returns the same 404 as a genuinely nonexistent id.

        The customer is found by mobile or (case-insensitive) email
        among existing CUSTOMER users, or created if no match exists —
        never rejected as a duplicate (unlike POST /customers). A repeat
        submission from the same resolved customer for the same property
        within 5 minutes is treated as an idempotent no-op (same success
        response, no second inquiry row).

        Rate-limited independently (PUBLIC_INQUIRY_RATE_LIMITER, 5
        requests/minute per IP) and CORS-enabled the same way as the
        public property routes.
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicPropertyInquiryRequest'
      responses:
        '201':
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInquiryResponse'
        '200':
          description: Duplicate submission within the deduplication window — treated as success, no new inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInquiryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Property does not exist, or is not currently public and available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many submissions from this address

  /public/inquiries:
    post:
      tags: [Public Properties]
      summary: Submit a general contact inquiry
      description: |
        Phase 45B. Unauthenticated. No property is associated
        (property_id is always NULL). The visitor explicitly selects
        `type` (BUYER or SELLER) — required, validated server-side.
        Same customer find-or-create behavior, same 5-minute duplicate
        window (keyed on customer + type for this endpoint, since there
        is no property to key on), same rate limiting and CORS as the
        property-specific endpoint above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicGeneralInquiryRequest'
      responses:
        '201':
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInquiryResponse'
        '200':
          description: Duplicate submission within the deduplication window — treated as success, no new inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInquiryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many submissions from this address

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Dashboard summary counts
      description: |
        Phase 22. One call returns every dashboard card — never poll the
        individual list endpoints just to compute counts.

        **Authorization**: ADMIN or EMPLOYEE (application bearer). MASTER
        cannot reach this endpoint (a master-scoped token fails the
        applicationBearer check entirely — MASTER has no Reports access,
        by design, unchanged from every other business-data module).

        **Role-based scoping**: `totalInquiries`, `assignedInquiries`,
        `unassignedInquiries`, `buyInquiries`, `sellInquiries`,
        `totalProperties`, `availableProperties`, `totalCustomers` are
        always global, for both ADMIN and EMPLOYEE — the same
        unrestricted visibility those roles already have via
        GET /properties, GET /customers, GET /inquiries.
        `todaysFollowUps`, `pendingFollowUps`, `overdueFollowUps` are
        global for ADMIN, but scoped to the caller's own assigned
        inquiries for EMPLOYEE (joined through
        `inquiries.assigned_to_user_id`, since `follow_ups` has no
        employee column of its own).

        "Today" is computed in IST (Asia/Kolkata, UTC+5:30), same fixed
        assumption as the existing `GET /follow-ups/today`. "Overdue"
        means `status = PENDING AND scheduledAt < now` — a computed
        condition, never a stored field.
      security:
        - applicationBearer: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/inquiries:
    get:
      tags: [Reports]
      summary: Inquiry report — totals and breakdowns
      description: |
        Phase 22. `byType`/`byStatus` always include every known enum
        key at `0` when no matching rows exist — never omitted.

        **Date semantics**: `fromDate`/`toDate` are calendar dates
        (`YYYY-MM-DD`, no time component), interpreted as IST calendar
        days and converted to a half-open UTC instant range —
        `[00:00:00.000 IST on fromDate, 00:00:00.000 IST the day after
        toDate)` — filtered against `inquiries.createdAt`. Both bounds
        are optional and independent; `toDate`'s entire IST calendar day
        is always included (never excluded by an off-by-one). This is
        the same date semantic used by every other report endpoint in
        this module except `/reports/follow-ups` (which filters by
        `scheduledAt`, not `createdAt` — see that endpoint's own
        description).

        `employeeId` filters by `assigned_to_user_id` (not
        `handledByUserId`) — the same "who owns this inquiry"
        relationship the dashboard and follow-up report use. Unlike the
        Employee Performance Report, this filter is not self-restricted
        for EMPLOYEE — it describes the same inquiries any staff member
        can already see in full via GET /inquiries.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/InquiryType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
      responses:
        '200':
          description: Inquiry report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/follow-ups:
    get:
      tags: [Reports]
      summary: Follow-up report — totals, pending/completed/overdue, today's
      description: |
        Phase 22. `employeeId` is enforced through the parent inquiry's
        `assigned_to_user_id` (`follow_ups → inquiries →
        assigned_to_user_id`) — `follow_ups` has no direct employee
        column, and none is invented here.

        **Date semantics**: unlike every other report in this module,
        `fromDate`/`toDate` filter against `scheduled_at` (when the
        follow-up is due), not `createdAt` — a follow-up created today
        but due next week belongs in next week's range, not today's.
        Same IST-calendar-day, half-open-interval conversion as
        `/reports/inquiries` otherwise.

        `todaysFollowUps` always reflects the current IST calendar day
        and is unaffected by `fromDate`/`toDate` (a fixed concept, not a
        queryable range) — `employeeId`/`status`, if given, still apply
        to it. `overdue` is `status = PENDING AND scheduledAt < now`, a
        computed condition, never a stored field. If `status` is
        supplied, every returned count is computed within that
        already-filtered set (e.g. `status=PENDING` makes `completed`
        report `0`, since no COMPLETED rows remain after filtering).
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FollowUpStatus'
      responses:
        '200':
          description: Follow-up report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/employees:
    get:
      tags: [Reports]
      summary: Employee performance report
      description: |
        Phase 22. Always returns an array, even when scoped to exactly
        one employee — a consistent shape regardless of role/filter, so
        the client never has to branch on response shape.

        **Authorization (server-enforced, not client-trusted)**: ADMIN
        may omit `employeeId` (returns every EMPLOYEE-role user) or pass
        any employeeId. **EMPLOYEE is always restricted to their own
        row** — omitting `employeeId` or passing their own id both
        resolve to "self"; passing a different employee's id returns
        `403 FORBIDDEN`, enforced server-side regardless of what the
        client UI would have allowed.

        `assignedInquiries`/`pendingFollowUps`/`completedFollowUps`/
        `overdueFollowUps` are live snapshots as of now (optionally
        narrowed by `fromDate`/`toDate` against `scheduled_at` for the
        follow-up counts). `assignmentsInPeriod` is genuine assignment
        *history* from `inquiry_assignments.assigned_at` — deliberately
        not derived from the current `assigned_to_user_id` snapshot,
        which cannot answer "how many assignments happened in this
        historical period" for an inquiry that has since been
        reassigned again.

        No `conversionRate` or similar metric is exposed — nothing in
        the schema distinguishes an inquiry that resulted in a sale from
        one closed for any other reason, so `status = COMPLETED` is
        never presented as "converted."
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employee performance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePerformanceListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: An EMPLOYEE attempted to query another employee's performance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The requested employeeId does not reference an existing application user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/properties:
    get:
      tags: [Reports]
      summary: Property report — totals and breakdowns
      description: |
        Phase 22. `byCategory` (the true enum) is the primary breakdown
        dimension — `property_type` is free text with no enum in the
        schema and is deliberately NOT used for aggregation here, since
        it fragments on casing/wording variation the same way an
        unnormalized city value would. `byCategory`/`byStatus` always
        include every known enum key at `0`.

        `byCity` groups by `LOWER(city)` to avoid fragmenting counts
        across casing variants of the same city, but the displayed
        `city` label is always one of the actual stored values — grouping
        never rewrites stored data. `city` (the filter parameter) is a
        case-insensitive exact match, the same convention already used
        by GET /properties and GET /public/properties.

        `publicCount`/`privateCount`: `isPublic` is a nullable boolean in
        the schema (never defaulted) — `NULL` is counted as private,
        matching how the public listing endpoint already treats anything
        other than `isPublic = true` as not public.

        Same `fromDate`/`toDate` calendar-date semantics as
        `/reports/inquiries`, filtered against `properties.createdAt`.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: city
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Property report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/customers:
    get:
      tags: [Reports]
      summary: Customer report
      description: |
        Phase 22. `totalCustomers` is always all-time, unfiltered.
        `customersInPeriod` and `topCustomersByInquiries` both respect
        `fromDate`/`toDate` (same calendar-date semantics as
        `/reports/inquiries`, filtered against `users.createdAt`) —
        when no range is given, both describe all customers.

        `topCustomersByInquiries` is a fixed top-10 (by inquiry count via
        `users LEFT JOIN inquiries` on the real customer relationship,
        `inquiries.customerId`) — a summary metric, not a replacement for
        the paginated GET /customers endpoint, and not further
        filterable/paginated in this phase. No generic "customer
        activity score" is exposed — the schema has no engagement/last-
        contacted field to genuinely support one; inquiry count is the
        one real, joinable activity signal that exists.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Customer report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/inquiries/records:
    get:
      tags: [Reports]
      summary: Inquiry report — paginated detail rows
      description: |
        Phase 31. The record-level rows behind `/reports/inquiries`'s
        KPI counts — same filters, same date semantics (createdAt,
        IST-calendar-day range), built from the identical shared filter
        logic server-side so the KPI numbers and this table can never
        describe different sets. `employeeId` is unrestricted for
        EMPLOYEE, matching `/reports/inquiries` itself (Phase 22
        precedent, reconfirmed for this phase).
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/InquiryType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Inquiry report detail rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryRecordListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/follow-ups/records:
    get:
      tags: [Reports]
      summary: Follow-up report — paginated detail rows
      description: |
        Phase 31. The record-level rows behind `/reports/follow-ups`'s
        KPI counts — same filters, same scheduled_at-based IST date
        range (not createdAt — see `/reports/follow-ups`'s own note),
        built from the identical shared filter logic. `overdue` is
        computed in SQL (`status = PENDING AND scheduledAt < now`) for
        each row individually, never a stored field. `assignedEmployeeName`
        is resolved through the parent inquiry's `assigned_to_user_id` —
        `follow_ups` has no direct employee column.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FollowUpStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Follow-up report detail rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpRecordListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/properties/records:
    get:
      tags: [Reports]
      summary: Property report — paginated detail rows
      description: |
        Phase 31. The record-level rows behind `/reports/properties`'s
        KPI counts — same filters plus `ownerCustomerId` (validated as a
        UUID), same createdAt-based IST date range, built from the
        identical shared filter logic. Reuses the same properties-LEFT-
        JOIN-users query GET /properties (list) and
        GET /properties/{propertyId} already use for owner resolution —
        no new join shape, no N+1.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: city
          in: query
          schema: { type: string }
        - name: ownerCustomerId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Property report detail rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyRecordListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/customers/records:
    get:
      tags: [Reports]
      summary: Customer report — paginated detail rows
      description: |
        Phase 31. The full, paginated version of `/reports/customers`'s
        `topCustomersByInquiries` — same filter (fromDate/toDate against
        `users.createdAt`, i.e. customers *created* in the period, not
        customers with activity in the period) and the identical
        `users LEFT JOIN inquiries` query, but without that endpoint's
        top-10 cap. `inquiryCount` is computed via `COUNT(i.id)` per
        customer, grouped in SQL — never fetched and counted in Flutter.
      security:
        - applicationBearer: []
      parameters:
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Customer report detail rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRecordListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/customers:
    get:
      tags: [Sync]
      summary: Incremental/full sync feed — customers
      description: |
        Phase 33. Read-only sync feed for the Flutter offline cache,
        reusing the exact `Customer` public shape and column set as
        `GET /customers` — no second response shape per entity. Keyset
        pagination on `(usersUpdatedAt, id)`, never OFFSET, so a page
        stays correct even while other rows are being written
        concurrently. `since` (omitted = full/initial sync, present =
        incremental sync since that watermark) and `cursor` (continues
        a listing already in progress) are independent, AND-composed
        filters — a client resends the same `since` across every page
        of one incremental sync. `nextCursor` is only non-null when
        `hasMore` is true. Read visibility is identical for ADMIN and
        EMPLOYEE, matching `GET /customers` itself — no new, sync-only
        authorization boundary is introduced.
      security:
        - applicationBearer: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Return only customers updated after this instant. Omit for a full/initial sync.
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque continuation cursor from a previous response's `nextCursor`.
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of customer sync records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/properties:
    get:
      tags: [Sync]
      summary: Incremental/full sync feed — properties
      description: |
        Phase 33. Same conventions as `/sync/customers`, reusing the
        exact `Property` shape (including `owner`/`ownerCustomerId`) via
        the same `PROPERTY_SELECT_WITH_OWNER` join used by `GET
        /properties`. Attachments are deliberately NOT embedded per row
        here (unlike `GET /properties/:propertyId`) — embedding them in
        a full listing would require one extra query per row (N+1);
        fetch a property's attachments via its detail endpoint instead.
      security:
        - applicationBearer: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Return only properties updated after this instant. Omit for a full/initial sync.
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of property sync records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/inquiries:
    get:
      tags: [Sync]
      summary: Incremental/full sync feed — inquiries
      description: |
        Phase 33. Same conventions as `/sync/customers`, reusing the
        exact `Inquiry` shape and the identical customer/handledBy/
        assignedTo name JOIN already used by `GET /inquiries`'s own
        list query. Assignment history is not embedded (matches
        `Inquiry`'s existing shape, which has never included it — see
        `GET /inquiries/:inquiryId/assignments` for that). No implicit
        EMPLOYEE-only filtering — identical to `GET /inquiries` today.
      security:
        - applicationBearer: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Return only inquiries updated after this instant. Omit for a full/initial sync.
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of inquiry sync records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/follow-ups:
    get:
      tags: [Sync]
      summary: Incremental/full sync feed — follow-ups
      description: |
        Phase 33. Same conventions as `/sync/customers`, reusing the
        exact `FollowUp` shape and column set as the nested
        `GET /inquiries/:inquiryId/follow-ups` list, but as one
        top-level, cross-inquiry feed keyed on `follow_ups.updatedAt`.
      security:
        - applicationBearer: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Return only follow-ups updated after this instant. Omit for a full/initial sync.
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of follow-up sync records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpSyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/deletions:
    get:
      tags: [Sync]
      summary: Deletion/tombstone feed for offline sync
      description: |
        Phase 33. Reads `audit_logs` — already written on every
        PROPERTY/CUSTOMER/INQUIRY/FOLLOW_UP/ATTACHMENT delete, but not
        read by any endpoint before this phase — as a zero-schema-change
        tombstone feed. Only `entityType`/`entityId`/`deletedAt`
        (`audit_logs.created_at`) are ever exposed; `old_values`/
        `new_values`/`ip_address`/`user_agent` are never returned.
        Keyset pagination on `(createdAt, id)`, same conventions as the
        other `/sync/*` endpoints.
      security:
        - applicationBearer: []
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Return only deletions recorded after this instant. Omit for a full/initial sync.
        - name: entityTypes
          in: query
          schema: { type: string }
          description: >-
            Comma-separated subset of PROPERTY, CUSTOMER, INQUIRY,
            FOLLOW_UP, ATTACHMENT. Omit to include all five.
          example: PROPERTY,CUSTOMER,INQUIRY,FOLLOW_UP,ATTACHMENT
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of deletion tombstones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionSyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

    masterBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FollowUpId:
      name: followUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: >-
        Phase 36. Too many login attempts from this source IP. Applies
        only to POST /auth/login and POST /master-auth/login, each
        backed by its own independent Cloudflare Rate Limiting binding
        (application login and MASTER login can never exhaust each
        other's budget). The response never reveals which email/account
        was attempted or any internal limiter state (current count,
        reset time) — same generic-failure principle as
        AUTH_INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    AttachmentType:
      type: string
      enum:
        - PHOTO
        - DOCUMENT
        - RECORDING

    DocumentType:
      type: string
      enum:
        - SEVEN_TWELVE
        - SALE_DEED
        - PROPERTY_CARD
        - NOC
        - OTHER

    PropertyCategory:
      type: string
      enum:
        - RESIDENTIAL
        - INDUSTRIAL
        - COMMERCIAL
        - AGRICULTURAL

    PropertyStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD
        - ON_HOLD
        - INACTIVE

    PropertyAreaUnit:
      type: string
      description: |
        Controlled list — was free-text before, with inconsistent
        real-world values ('SQ.FT'/'sq.ft'/'SQ FT'), now normalized.
        SQ_FT/SQ_YD/SQ_M for residential/commercial-scale listings;
        ACRE/GUNTHA/HECTARE for agricultural land. SQ_YD/SQ_M added later
        as a purely additive change (Postgres ALTER TYPE ... ADD VALUE),
        matching Flutter's six-value area-unit picker.
      enum:
        - SQ_FT
        - SQ_YD
        - SQ_M
        - ACRE
        - GUNTHA
        - HECTARE

    InquiryStatus:
      type: string
      enum:
        - NEW
        - IN_PROGRESS
        - ON_HOLD
        - COMPLETED
        - CANCELLED

    InquiryPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - URGENT

    InquiryType:
      type: string
      description: |
        BUYER = a customer looking to purchase; SELLER = a customer
        looking to sell the associated property. Introduced in Phase 11
        to replace the prior free-text `type` field, for buyer/property
        matching (GET /inquiries/{inquiryId}/matches).
      enum:
        - BUYER
        - SELLER

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: EMP001
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, user]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 2592000
              description: >-
                Phase 35: application session lifetime, in seconds (30
                days — raised from the original 3600s). There is no
                refresh token; a session instead ends via explicit
                logout or ADMIN deactivation (enforced server-side on
                the next authenticated request, per requireApplicationAuth's
                live status check), whichever comes first.
            user:
              $ref: '#/components/schemas/User'

    MasterLoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, tokenScope, isMaster]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            tokenScope:
              type: string
              example: MASTER
            isMaster:
              type: boolean
              example: true
              description: >-
                Phase 35: explicit capability flag so the client can
                identify a MASTER session directly from the login
                response, instead of inferring it from which login
                endpoint was called. Always true on this response;
                never present on POST /auth/login's response.
            expiresIn:
              type: integer
              example: 3600
              description: MASTER token lifetime is unchanged by Phase 35.

    CreateApplicationUserRequest:
      type: object
      required: [name, mobile, password, role]
      properties:
        userId:
          type: string
          example: EMP001
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]

    UpdateApplicationUserRequest:
      type: object
      description: |
        Phase 15A — MASTER-only partial update of an ADMIN/EMPLOYEE.
        Everything optional. Excludes userId (stable business identifier)
        and password (password change is not part of this endpoint — no
        password-reset flow exists yet). role stays restricted to
        ADMIN/EMPLOYEE — MASTER can never be assigned here either.

        A role change takes effect for future logins only: an
        already-issued JWT keeps its original `role` claim until it
        expires (now up to 30 days — see LoginResponse) or the user logs
        in again — role is never re-checked against the DB per request.

        A status change, as of Phase 35, takes effect immediately:
        requireApplicationAuth re-checks the token holder's current
        `users.status` on every authenticated request (see
        PATCH /users/{id} below, the staff-facing ADMIN equivalent of
        this status change), so setting status to anything other than
        ACTIVE here invalidates that user's existing session the moment
        they next reach the backend — not only on their next login.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
          description: |
            ACTIVE users can log in; INACTIVE/BLOCKED are rejected at
            POST /auth/login (existing behavior, unchanged by this
            phase) but a currently-held JWT is not revoked immediately.

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string

    Customer:
      type: object
      description: |
        Matches the actual response of CustomersService/customer.mapper.ts
        exactly (a distinct shape from User — passwordHash, userId, and
        role never apply to a CUSTOMER and are not part of this schema).
      required: [id, userType, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userType:
          type: string
          enum: [CUSTOMER]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        alternateMobile:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Customer'

    CustomerListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/Pagination'

    User:
      type: object
      required: [id, userType, name, status]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          nullable: true
        userType:
          type: string
          enum: [APPLICATION_USER, CUSTOMER, MASTER]
        role:
          type: string
          nullable: true
          enum: [ADMIN, EMPLOYEE]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]

    UserSummary:
      type: object
      required: [id, name]
      description: |
        Minimal, embeddable display identity for a user (Phase 14A) — id
        and name only. Deliberately does not carry email/mobile/role/
        status/userId; unlike User above, it's for label-only embedding
        (e.g. Inquiry.handledBy/assignedTo), never for anything requiring
        the full user record.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UpdateUserStatusRequest:
      type: object
      required: [status]
      description: |
        Phase 35 — the request body for PATCH /users/{id}. `status` is
        the only accepted field; the endpoint returns 400 if any other
        key (role, email, password, etc.) is present in the body at all,
        rather than silently ignoring it.
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
      additionalProperties: false

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreatePropertyRequest:
      type: object
      required: [propertyType, category]
      description: |
        priceUnit is not part of this request (this phase) — this
        application is India-only, price is always INR, applied
        server-side; it is not client-settable. mapUrl accepts any valid
        URL (e.g. a Google Maps shareable location link produced by
        Flutter's own map picker) — no Google Maps API integration or key
        exists or is required on the backend for this.
      properties:
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        area:
          type: number
          minimum: 0
        areaUnit:
          $ref: '#/components/schemas/PropertyAreaUnit'
        price:
          type: number
          minimum: 0
        gatNoDetails:
          type: string
        description:
          type: string
        address:
          type: string
        locality:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        mapUrl:
          type: string
          format: uri
          description: |
            A shareable location URL (e.g. from Google Maps) selected via
            Flutter's own map picker. Validated as a well-formed URL only
            — not verified against any Maps API.
        ownerCustomerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Phase 26. The actual CUSTOMER who owns the property — must
            reference an existing user with userType=CUSTOMER (rejected
            with VALIDATION_ERROR otherwise, including a reference to an
            ADMIN/EMPLOYEE/MASTER user, or to a user id that doesn't
            exist at all). Deliberately unrelated to createdBy (the
            staff member who entered the listing) and never inferred
            from a SELLER inquiry. On create, omitting this field or
            passing null both mean "no owner assigned". On update,
            omitting the field leaves the existing owner unchanged;
            explicitly passing null clears it — the key's presence in
            the request body is significant, not just its value.

    UpdatePropertyRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePropertyRequest'
      properties:
        status:
          $ref: '#/components/schemas/PropertyStatus'
        isPublic:
          type: boolean
          description: |
            Controls whether this property appears in
            GET /public/properties (also requires status=AVAILABLE).
            ADMIN only — an EMPLOYEE-authenticated request that includes
            this field is rejected.

    Property:
      type: object
      required: [id, propertyCode, propertyType, category, status, isPublic]
      properties:
        id:
          type: string
          format: uuid
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        area:
          type: number
          nullable: true
        areaUnit:
          allOf:
            - $ref: '#/components/schemas/PropertyAreaUnit'
          nullable: true
        price:
          type: number
          nullable: true
        priceUnit:
          type: string
          nullable: true
          description: |
            Always "INR" in practice (this application is India-only) —
            not client-settable via CreatePropertyRequest/
            UpdatePropertyRequest (this phase). Kept in the response for
            backward compatibility with existing clients reading it; the
            database column and value are both retained, only the
            request contract changed.
        gatNoDetails:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        mapUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PropertyStatus'
        isPublic:
          type: boolean
        ownerCustomerId:
          type: string
          format: uuid
          nullable: true
          description: Phase 26. Flat foreign key — null when unassigned. See PropertyOwner for the display-ready form.
        owner:
          allOf:
            - $ref: '#/components/schemas/PropertyOwner'
          nullable: true
          description: |
            Phase 26. Null when ownerCustomerId is null, or when it's set
            but the referenced user could not be resolved. Present
            (id/name/mobile only — never a full Customer/User object) in
            both GET /properties (list) and GET /properties/{propertyId}
            (detail); the list endpoint resolves this via one JOIN, not a
            per-property lookup.

    PropertyOwner:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mobile:
          type: string
          nullable: true

    PropertyResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Property'

    PropertyDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Property'
            - type: object
              properties:
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'

    PropertyListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateAttachmentUploadRequest:
      type: object
      required:
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
      properties:
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for PHOTO/DOCUMENT unless inquiryId is set instead
            (mutually exclusive). Must be absent for RECORDING.
        inquiryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for RECORDING. For PHOTO/DOCUMENT, may be used
            instead of propertyId during lightweight inquiry capture
            (Phase 13B) — mutually exclusive with propertyId.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        isPrimary:
          type: boolean
          default: false

    FinalizeAttachmentRequest:
      type: object
      required:
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
        - r2ObjectKey
      properties:
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for PHOTO/DOCUMENT unless inquiryId is set instead
            (mutually exclusive). Must be absent for RECORDING.
        inquiryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for RECORDING. For PHOTO/DOCUMENT, may be used
            instead of propertyId during lightweight inquiry capture
            (Phase 13B) — mutually exclusive with propertyId.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        r2ObjectKey:
          type: string
        isPrimary:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 0

    Attachment:
      type: object
      required:
        - id
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
        - r2ObjectKey
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        inquiryId:
          type: string
          format: uuid
          nullable: true
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          description: Attachment size in bytes.
        r2Bucket:
          type: string
        r2ObjectKey:
          type: string
        fileUrl:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AttachmentResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Attachment'

    AttachmentListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    UploadUrlResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [uploadUrl, r2ObjectKey, expiresIn]
          properties:
            uploadUrl:
              type: string
              format: uri
            r2ObjectKey:
              type: string
            expiresIn:
              type: integer
              example: 900

    AttachmentDownloadUrlResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [downloadUrl, expiresIn]
          properties:
            downloadUrl:
              type: string
              format: uri
              description: A presigned R2 GET URL, valid only for expiresIn seconds. Not meant to be stored or reused.
            expiresIn:
              type: integer
              example: 300

    CreateInquiryRequest:
      type: object
      description: |
        customerId and propertyId are both optional (Phase 13B) — an
        ADMIN taking a call can create a lightweight inquiry
        (customerId=null, propertyId=null, type=null, status=NEW) before
        either master record has been identified, then attach a
        recording/photos/documents against the returned inquiryId and
        assign an EMPLOYEE. The EMPLOYEE later identifies/creates the
        customer and property via PATCH /inquiries/{inquiryId}.
      properties:
        customerId:
          type: string
          format: uuid
          nullable: true
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/InquiryType'
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string
        city:
          type: string
          description: |
            Unified location field (this phase), used by both BUYER and SELLER.
            For a SELLER inquiry with propertyId set, ignored and overridden by
            the linked property's own city.
        state:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        pincode:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        locality:
          type: string
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal alongside
            city. Same SELLER-sync override rule as city (synced from
            Property.locality, never Property.address).
        maxBudget:
          type: number
          minimum: 0
          description: BUYER matching preference — maximum price the buyer is willing to pay.
        minBudget:
          type: number
          minimum: 0
          description: >-
            Phase 40B — BUYER matching preference, minimum acceptable
            price. Optional; a candidate below this (when both minBudget
            and maxBudget are set) scores a gradually decreasing budget
            percentage rather than a full 100.
        desiredPropertyType:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Phase 40B — BUYER matching preference for property type.
            Free text, compared against a SELLER property's own
            propertyType via exact match after trim+lowercase — no
            enum on either side, no fuzzy/synonym matching.
        desiredMinArea:
          type: number
          minimum: 0
          description: >-
            Phase 40B — BUYER matching preference: the MINIMUM area
            required (not an exact target). Must be paired with
            desiredAreaUnit to be used in matching.
        desiredAreaUnit:
          $ref: '#/components/schemas/PropertyAreaUnit'
          description: >-
            Phase 40B — unit for desiredMinArea. Reuses the exact same
            enum Property.areaUnit already uses (SQ_FT/SQ_YD/SQ_M/ACRE/
            GUNTHA/HECTARE) — no new unit is introduced.

    UpdateInquiryRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/InquiryType'
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
        assignedToUserId:
          type: string
          format: uuid
        remarks:
          type: string
        city:
          type: string
          description: |
            Unified location field (this phase), used by both BUYER and SELLER.
            For a SELLER inquiry, ignored/overridden whenever propertyId changes
            in the same request.
        state:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        pincode:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        locality:
          type: string
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal alongside
            city. Same SELLER-sync override rule as city.
        maxBudget:
          type: number
          minimum: 0
          description: BUYER matching preference — maximum price the buyer is willing to pay.
        minBudget:
          type: number
          minimum: 0
          description: Phase 40B — see CreateInquiryRequest.minBudget.
        desiredPropertyType:
          type: string
          minLength: 1
          maxLength: 50
          description: Phase 40B — see CreateInquiryRequest.desiredPropertyType.
        desiredMinArea:
          type: number
          minimum: 0
          description: Phase 40B — see CreateInquiryRequest.desiredMinArea.
        desiredAreaUnit:
          $ref: '#/components/schemas/PropertyAreaUnit'
          description: Phase 40B — see CreateInquiryRequest.desiredAreaUnit.

    AssignInquiryRequest:
      type: object
      required: [assignedToUserId]
      properties:
        assignedToUserId:
          type: string
          format: uuid
        reason:
          type: string

    PublicVisibilityRequest:
      type: object
      required: [isPublic]
      properties:
        isPublic:
          type: boolean

    Inquiry:
      type: object
      required: [id, inquiryNumber, customerId, customerName, priority, status, isPublic]
      properties:
        id:
          type: string
          format: uuid
        inquiryNumber:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
          description: |
            NULL for a lightweight inquiry (Phase 13B) until an EMPLOYEE
            sets it via PATCH /inquiries/{inquiryId}.
        customerName:
          type: string
          nullable: true
          description: |
            This phase — the linked customer's display name, straight
            from GET /inquiries (no extra GET /customers/{id} request
            needed). Null exactly when customerId is null. Fetched via
            the same single relation-include as handledBy/assignedTo, so
            listing a page of inquiries costs one query, not one per row.
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/InquiryType'
          nullable: true
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
          nullable: true
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        handledBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: |
            Minimal display identity for handledByUserId (Phase 14A) — null
            when unassigned. handledByUserId remains the field to use for
            API operations/authorization; this is read-model only.
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        assignedTo:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: |
            Minimal display identity for assignedToUserId (Phase 14A) —
            null when unassigned. assignedToUserId remains the field to use
            for API operations/authorization; this is read-model only.
        remarks:
          type: string
          nullable: true
        isPublic:
          type: boolean
        city:
          type: string
          nullable: true
          description: |
            Unified location field (this phase, replacing the old BUYER-only
            preferredCity), used by both BUYER and SELLER. For a SELLER
            inquiry, kept in sync with the linked property's own city — see
            InquiriesService/PropertiesService for the sync rule; never
            independently editable while a property is linked.
        state:
          type: string
          nullable: true
          description: Unified location field (this phase). Same SELLER-sync rule as city.
        pincode:
          type: string
          nullable: true
          description: |
            Unified location field (this phase, replacing the old BUYER-only
            preferredPincode). A scored matching dimension (20% weight) as of
            Phase 40B — no longer a mandatory gate. See
            GET /inquiries/{inquiryId}/matches.
        locality:
          type: string
          nullable: true
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal
            alongside city. For a SELLER inquiry, synced from
            Property.locality only (never Property.address).
        maxBudget:
          type: number
          nullable: true
          description: BUYER matching preference — maximum price the buyer is willing to pay.
        minBudget:
          type: number
          nullable: true
          description: Phase 40B — BUYER matching preference, minimum acceptable price. See CreateInquiryRequest.minBudget.
        desiredPropertyType:
          type: string
          nullable: true
          description: Phase 40B — BUYER matching preference for property type. See CreateInquiryRequest.desiredPropertyType.
        desiredMinArea:
          type: number
          nullable: true
          description: Phase 40B — BUYER matching preference, minimum required area. See CreateInquiryRequest.desiredMinArea.
        desiredAreaUnit:
          allOf:
            - $ref: '#/components/schemas/PropertyAreaUnit'
          nullable: true
          description: Phase 40B — unit for desiredMinArea.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            NULL until the inquiry has been submitted via
            POST /inquiries/{inquiryId}/submit. Never settable through
            create/update requests.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InquiryDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Inquiry'
            - type: object
              properties:
                customer:
                  $ref: '#/components/schemas/User'
                property:
                  $ref: '#/components/schemas/Property'
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'

    InquiryListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Inquiry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Assignment:
      type: object
      description: |
        Phase 18A: assignedFrom/assignedTo added alongside the existing
        *UserId fields (kept for backward compatibility) — minimal
        {id, name} display identity, same UserSummary shape used
        elsewhere (e.g. Inquiry.handledBy/assignedTo). assignedFrom is
        null for the first-ever assignment of an inquiry (nothing to
        reassign from).
      required: [id, inquiryId, assignedToUserId, assignedTo, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        inquiryId:
          type: string
          format: uuid
        assignedFromUserId:
          type: string
          format: uuid
          nullable: true
        assignedFrom:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
        assignedTo:
          $ref: '#/components/schemas/UserSummary'
        assignedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid

    AssignmentListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'

    MatchBreakdown:
      type: object
      description: >-
        Phase 40B — per-dimension match percentages, each 0-100 or null
        ("not comparable for this candidate — excluded from the overall
        weighted average, never counted as a failing 0"). See the
        matches endpoint description for each dimension's exact formula
        and weight.
      properties:
        pincode:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        city:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        state:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        locality:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        propertyType:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        area:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        budget:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    InquiryMatch:
      type: object
      description: |
        An opposite-type inquiry that reached an overallMatchPercentage
        of at least 50 AND has at least one genuine (100%) location
        dimension, against the source inquiry (Phase 11; bidirectional
        as of Phase 19A; redesigned as a percentage-based, 7-dimension
        engine as of Phase 40B, replacing the old fixed-point
        `matchingScore`). For a SELLER source, entries are matching
        BUYER inquiries; for a BUYER source, entries are matching
        SELLER inquiries. See the matches endpoint description for the
        full per-dimension formula/weights and the inclusion rule.

        inquiryType/propertyId are additive (Phase 19A). city/state/
        pincode/locality are populated for BOTH match types — for a
        SELLER match these now come from the matched inquiry's *linked
        Property* (Phase 40B; previously the inquiry's own copied
        fields), for a BUYER match from the inquiry itself.
      required: [inquiryId, inquiryType, customerId, customerName, overallMatchPercentage, matchBreakdown]
      properties:
        inquiryId:
          type: string
          format: uuid
          description: The matched inquiry's id — use this to navigate to it.
        inquiryType:
          $ref: '#/components/schemas/InquiryType'
          description: Which side this match is (BUYER or SELLER).
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        customerMobile:
          type: string
          nullable: true
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            The matched inquiry's property, if any. Populated for
            inquiryType=SELLER matches (fetch GET /properties/{propertyId}
            for full detail); null for inquiryType=BUYER matches.
        city:
          type: string
          nullable: true
          description: >-
            For inquiryType=SELLER, sourced from the linked Property
            (Phase 40B). For inquiryType=BUYER, from the inquiry itself.
        state:
          type: string
          nullable: true
          description: Same sourcing rule as city.
        pincode:
          type: string
          nullable: true
          description: Same sourcing rule as city.
        locality:
          type: string
          nullable: true
          description: Same sourcing rule as city.
        maxBudget:
          type: number
          nullable: true
          description: Null for inquiryType=SELLER matches (a buyer-preference field).
        overallMatchPercentage:
          type: integer
          minimum: 50
          maximum: 100
          description: >-
            Phase 40B — weighted average of matchBreakdown's non-null
            dimensions. Replaces the old fixed-point matchingScore.
        matchBreakdown:
          $ref: '#/components/schemas/MatchBreakdown'

    InquiryMatchListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/InquiryMatch'
          description: Sorted by matchingScore descending. Only scores >= 70 are included.

    FollowUpStatus:
      type: string
      enum: [PENDING, COMPLETED]
      description: |
        Phase 16A — matches the old web UI exactly. Deliberately just
        these two; no CANCELLED/MISSED/RESCHEDULED/OVERDUE.

    CreateFollowUpRequest:
      type: object
      required: [scheduledAt]
      description: |
        No inquiryId — taken from the URL path. scheduledAt is a single
        ISO-8601 date-time (the old UI's separate Date/Time fields are
        combined client-side before sending).
      properties:
        scheduledAt:
          type: string
          format: date-time
        status:
          allOf:
            - $ref: '#/components/schemas/FollowUpStatus'
          default: PENDING
        notes:
          type: string
        reminderEnabled:
          type: boolean
          default: false

    UpdateFollowUpRequest:
      type: object
      description: |
        Everything from CreateFollowUpRequest, all optional. Setting
        status=COMPLETED is how a follow-up is completed — no separate
        endpoint.
      properties:
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FollowUpStatus'
        notes:
          type: string
        reminderEnabled:
          type: boolean

    FollowUp:
      type: object
      required:
        - id
        - inquiryId
        - scheduledAt
        - status
        - reminderEnabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        inquiryId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FollowUpStatus'
        notes:
          type: string
          nullable: true
        reminderEnabled:
          type: boolean
          description: |
            Persisted as business data only (Phase 16A) — no push/email/
            SMS/local notification is sent when this is true. Flutter
            reads it to show a reminder indicator.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FollowUpResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/FollowUp'

    FollowUpListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/FollowUp'

    TodayFollowUp:
      type: object
      description: |
        FollowUp plus a minimal embedded inquiry summary — deliberately
        not the full Inquiry/User schemas (Phase 16A Part 8). customer is
        null for a lightweight inquiry that has no customer yet.
      allOf:
        - $ref: '#/components/schemas/FollowUp'
        - type: object
          required: [inquiry]
          properties:
            inquiry:
              type: object
              required: [id, inquiryNumber, status, customer]
              properties:
                id:
                  type: string
                  format: uuid
                inquiryNumber:
                  type: string
                status:
                  $ref: '#/components/schemas/InquiryStatus'
                customer:
                  type: object
                  nullable: true
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string

    TodayFollowUpListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TodayFollowUp'

    Notification:
      type: object
      description: |
        In-app notification. Produced by two events: an ADMIN assigning/
        reassigning an inquiry to an employee (type=INQUIRY_ASSIGNED) —
        employee-initiated assignment does not produce one, by design
        (see POST /inquiries/{inquiryId}/assign) — and, as of Phase 38D,
        a follow-up reminder becoming due (type=FOLLOW_UP_REMINDER,
        entityType=FOLLOW_UP, entityId=the follow-up id), created by a
        Cloudflare Cron-triggered scheduled job rather than an HTTP
        route, recipient always the parent inquiry's assigned employee,
        sent at most once per follow-up. Generic on purpose (same
        entityType/entityId/free-text-type shape as internal audit
        events) so a new notification type never needs a contract
        change — confirmed again by this addition requiring none.
      required: [id, type, title, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: INQUIRY_ASSIGNED
        title:
          type: string
        message:
          type: string
        entityType:
          type: string
          nullable: true
          example: INQUIRY
        entityId:
          type: string
          format: uuid
          nullable: true
          description: With entityType=INQUIRY, the inquiry to navigate to.
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotificationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Notification'

    UpdateNotificationRequest:
      type: object
      description: The only supported change is marking a notification read/unread.
      properties:
        isRead:
          type: boolean

    RegisterDeviceTokenRequest:
      type: object
      description: |
        Phase 41C. The FCM registration token as issued by the Firebase
        SDK on the device — accepted here only to be stored, never
        returned by any endpoint.
      required: [token, platform]
      properties:
        token:
          type: string
          description: The FCM registration token. Never echoed back in any response.
        platform:
          type: string
          enum: [ANDROID, IOS]

    RegisterDeviceTokenResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [registered]
          properties:
            registered:
              type: boolean

    DeregisterDeviceTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The FCM registration token to deactivate.

    DeregisterDeviceTokenResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [deactivated]
          properties:
            deactivated:
              type: boolean

    PublicPhoto:
      type: object
      required: [id, fileUrl, isPrimary, displayOrder]
      description: |
        A PHOTO attachment as exposed to public visitors — deliberately a
        narrower shape than Attachment: no r2Bucket/r2ObjectKey (internal
        storage details) and no uploadedBy (employee information).
        Phase 42B: `fileUrl` is now a short-lived signed R2 GET URL,
        minted fresh per request (previously always null — no public R2
        base URL is configured, and this bucket stays private by
        design), rather than a stable public link.
      properties:
        id:
          type: string
          format: uuid
        fileUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL, or null if it could not be minted (e.g. R2 temporarily unreachable) — never a stable/cacheable link.
        isPrimary:
          type: boolean
        displayOrder:
          type: integer

    PublicProperty:
      type: object
      required:
        [
          id,
          propertyCode,
          propertyType,
          category,
          status,
          area,
          areaUnit,
          price,
          priceUnit,
          description,
          address,
          locality,
          city,
          state,
          pincode,
          latitude,
          longitude,
          mapUrl,
          photos,
        ]
      description: |
        Phase 42B: a standalone schema — deliberately NOT built on top of
        the internal `Property` schema (allOf), specifically so
        `ownerCustomerId`/`owner` (internal customer identifiers, no
        legitimate public purpose) and `isPublic`/`gatNoDetails` can
        never appear here by construction, not merely by omission at
        write time. Mirrors the backend's own dedicated
        toPublicPropertySummary() mapper (routes/public-properties.ts),
        which is built from an explicit allow-list, not a stripped-down
        copy of the internal mapper.
      properties:
        id:
          type: string
          format: uuid
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        area:
          type: number
          nullable: true
        areaUnit:
          allOf:
            - $ref: '#/components/schemas/PropertyAreaUnit'
          nullable: true
        price:
          type: number
          nullable: true
        priceUnit:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        mapUrl:
          type: string
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PublicPhoto'

    PublicPropertyResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PublicProperty'

    PublicPropertyListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicProperty'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PublicPropertyInquiryRequest:
      type: object
      required: [name, mobile, message]
      description: |
        Phase 45B. `type` is deliberately not a field here — the server
        always creates a BUYER inquiry for this endpoint; sending `type`
        is rejected with a VALIDATION_ERROR.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        mobile:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        message:
          type: string
          minLength: 1
          maxLength: 1500

    PublicGeneralInquiryRequest:
      allOf:
        - $ref: '#/components/schemas/PublicPropertyInquiryRequest'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [BUYER, SELLER]

    PublicInquiryResponse:
      type: object
      required: [success, data]
      description: |
        Deliberately minimal — the response envelope matches this API's
        universal {success, data} convention, and `data` never includes
        the inquiry id, the customer id, the assigned/handling employee,
        or any other internal identifier.
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Thank you. Your inquiry has been submitted successfully.

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
        requestId:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true

    # --- Phase 22: Reports -------------------------------------------

    DashboardSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - totalInquiries
            - assignedInquiries
            - unassignedInquiries
            - buyInquiries
            - sellInquiries
            - todaysFollowUps
            - pendingFollowUps
            - overdueFollowUps
            - totalProperties
            - availableProperties
            - totalCustomers
          properties:
            totalInquiries: { type: integer }
            assignedInquiries: { type: integer }
            unassignedInquiries: { type: integer }
            buyInquiries: { type: integer }
            sellInquiries: { type: integer }
            todaysFollowUps: { type: integer }
            pendingFollowUps: { type: integer }
            overdueFollowUps: { type: integer }
            totalProperties: { type: integer }
            availableProperties: { type: integer }
            totalCustomers: { type: integer }

    InquiryReportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [total, byType, byStatus, assigned, unassigned]
          properties:
            total:
              type: integer
              description: >-
                May exceed byType.BUYER + byType.SELLER, since `type` is
                nullable on inquiries — rows with no type still count
                toward `total`.
            byType:
              type: object
              properties:
                BUYER: { type: integer }
                SELLER: { type: integer }
            byStatus:
              type: object
              properties:
                NEW: { type: integer }
                IN_PROGRESS: { type: integer }
                ON_HOLD: { type: integer }
                COMPLETED: { type: integer }
                CANCELLED: { type: integer }
            assigned:
              type: integer
            unassigned:
              type: integer

    FollowUpReportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [total, pending, completed, overdue, todaysFollowUps]
          properties:
            total: { type: integer }
            pending: { type: integer }
            completed: { type: integer }
            overdue: { type: integer }
            todaysFollowUps: { type: integer }

    EmployeePerformanceReport:
      type: object
      required:
        - id
        - name
        - assignedInquiries
        - pendingFollowUps
        - completedFollowUps
        - overdueFollowUps
        - assignmentsInPeriod
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assignedInquiries:
          type: integer
          description: Live snapshot count, not date-range filtered.
        pendingFollowUps:
          type: integer
        completedFollowUps:
          type: integer
        overdueFollowUps:
          type: integer
        assignmentsInPeriod:
          type: integer
          description: >-
            From inquiry_assignments.assigned_at — genuine assignment
            history, not the current assigned_to_user_id snapshot.

    EmployeePerformanceListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeePerformanceReport'

    PropertyReportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [total, byCategory, byStatus, publicCount, privateCount, byCity]
          properties:
            total:
              type: integer
            byCategory:
              type: object
              properties:
                RESIDENTIAL: { type: integer }
                INDUSTRIAL: { type: integer }
                COMMERCIAL: { type: integer }
                AGRICULTURAL: { type: integer }
            byStatus:
              type: object
              properties:
                AVAILABLE: { type: integer }
                SOLD: { type: integer }
                ON_HOLD: { type: integer }
                INACTIVE: { type: integer }
            publicCount:
              type: integer
            privateCount:
              type: integer
            byCity:
              type: array
              items:
                type: object
                properties:
                  city:
                    type: string
                  count:
                    type: integer

    CustomerReportResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [totalCustomers, customersInPeriod, topCustomersByInquiries]
          properties:
            totalCustomers:
              type: integer
              description: Always all-time, unfiltered by fromDate/toDate.
            customersInPeriod:
              type: integer
            topCustomersByInquiries:
              type: array
              maxItems: 10
              items:
                type: object
                properties:
                  customerId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  inquiryCount:
                    type: integer

