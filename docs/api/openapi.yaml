                    $ref: '#/components/schemas/FollowUp'

    DeletionTombstone:
      type: object
      required: [entityType, entityId, deletedAt]
      properties:
        entityType:
          type: string
          enum: [PROPERTY, CUSTOMER, INQUIRY, FOLLOW_UP, ATTACHMENT]
        entityId:
          type: string
          format: uuid
        deletedAt:
          type: string
          format: date-time

    DeletionSyncResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: '#/components/schemas/SyncPageData'
            - type: object
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/DeletionTombstone'
