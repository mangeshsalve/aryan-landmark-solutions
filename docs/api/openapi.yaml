openapi: 3.0.3

info:
  title: Aryan Landmark Solutions API
  version: 1.0.0
  description: |
    Production REST API for Aryan Landmark Solutions.

    PostgreSQL contains six tables. All property photos, property documents
    and inquiry call recordings use one unified `attachments` resource.

    Cloudflare R2 stores file binaries. PostgreSQL stores metadata and the R2
    object key.

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Authentication
  - name: Master Authentication
  - name: Master Management
  - name: Users
  - name: Customers
  - name: Properties
  - name: Attachments
  - name: Inquiries
  - name: Inquiry Assignments
  - name: Public Properties

paths:

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login ADMIN or EMPLOYEE
      description: |
        `username` is users.user_id.

        CUSTOMER and MASTER cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /master-auth/login:
    post:
      tags: [Master Authentication]
      summary: Login Master Record Management
      description: |
        MASTER is manually provisioned in the users table.
        There is no public master-registration endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Master login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /master/users:
    post:
      tags: [Master Management]
      summary: Create ADMIN or EMPLOYEE
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /master/customers:
    post:
      tags: [Master Management]
      summary: Create CUSTOMER master record
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users:
    get:
      tags: [Users]
      summary: List application users
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, EMPLOYEE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Matches against name, mobile, or email
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'

    post:
      tags: [Customers]
      summary: Create customer
      description: |
        Creates a customer master record (users.user_type = CUSTOMER).
        Available to ADMIN and EMPLOYEE application users. createdBy is
        derived from the authenticated JWT, never accepted from the
        request body.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer details
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties:
    get:
      tags: [Properties]
      summary: List properties
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'

    post:
      tags: [Properties]
      summary: Create property
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}:
    get:
      tags: [Properties]
      summary: Get property
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'

    patch:
      tags: [Properties]
      summary: Update property
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /attachments/upload-url:
    post:
      tags: [Attachments]
      summary: Create a short-lived Cloudflare R2 upload authorization
      description: |
        Unified file upload endpoint.

        Use `attachmentType=PHOTO` for property photos,
        `attachmentType=DOCUMENT` for 7/12 and other property documents,
        `attachmentType=RECORDING` for inquiry call recordings.

        The backend validates resource ownership/authorization and returns
        a short-lived upload URL and generated R2 object key.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachmentUploadRequest'
      responses:
        '200':
          description: R2 upload authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: File too large

  /attachments:
    post:
      tags: [Attachments]
      summary: Finalize an uploaded attachment
      description: |
        The client calls this endpoint after uploading the binary to R2.

        The backend verifies the expected object and creates one row in the
        `attachments` table.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAttachmentRequest'
      responses:
        '201':
          description: Attachment metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Attachments]
      summary: List attachments
      description: |
        Filter by propertyId, inquiryId and attachmentType.
      security:
        - applicationBearer: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
        - name: inquiryId
          in: query
          schema:
            type: string
            format: uuid
        - name: attachmentType
          in: query
          schema:
            $ref: '#/components/schemas/AttachmentType'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'

  /attachments/{attachmentId}:
    delete:
      tags: [Attachments]
      summary: Delete attachment
      description: |
        Deletes the attachment metadata and performs the corresponding
        authorized Cloudflare R2 object deletion.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries:
    get:
      tags: [Inquiries]
      summary: List inquiries
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/InquiryPriority'
        - name: assignedToUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: handledByUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'

    post:
      tags: [Inquiries]
      summary: Create inquiry
      description: |
        Creator is derived from the authenticated JWT.

        ADMIN:
        At least one RECORDING attachment associated with this inquiry is
        required before creation is considered complete.

        EMPLOYEE:
        Recording is optional.

        The client must not send a creator role for authorization.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /inquiries/{inquiryId}:
    get:
      tags: [Inquiries]
      summary: Get inquiry details
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'

    patch:
      tags: [Inquiries]
      summary: Update inquiry
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInquiryRequest'
      responses:
        '200':
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'

  /inquiries/{inquiryId}/submit:
    post:
      tags: [Inquiries]
      summary: Submit an inquiry
      description: |
        Submit an existing inquiry after validating that all mandatory
        requirements are satisfied.

        Sets inquiries.submitted_at to the current time. Fails with a
        conflict if the inquiry has already been submitted
        (submitted_at is already set).

        If the inquiry's creator (created_by) is an ADMIN, at least one
        RECORDING attachment for this inquiry is required, or the
        request is rejected. If the creator is an EMPLOYEE, the
        recording is optional. The creator's role is read from the
        inquiry's created_by user, not from the caller submitting it —
        an EMPLOYEE may submit an ADMIN-created inquiry and the ADMIN
        recording requirement still applies, and vice versa.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: ADMIN inquiry submitted without a required recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries/{inquiryId}/assign:
    post:
      tags: [Inquiry Assignments]
      summary: Assign or reassign inquiry
      description: |
        Updates inquiries.assigned_to_user_id and inserts an
        inquiry_assignments history row in one database transaction.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInquiryRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'

  /inquiries/{inquiryId}/assignments:
    get:
      tags: [Inquiry Assignments]
      summary: Get assignment history
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'

  /inquiries/{inquiryId}/matches:
    get:
      tags: [Inquiries]
      summary: Find matching buyer inquiries for a seller inquiry
      description: |
        Phase 11 buyer/property matching foundation. The path inquiry
        must have type=SELLER and an associated property; matches are
        BUYER inquiries scored against that property:

          location (50%): candidate.preferredCity equals property.city
          (case-insensitive)
          pincode (30%): candidate.preferredPincode equals
          property.pincode (exact match)
          budget (20%): property.price <= candidate.maxBudget

        Only candidates scoring 70 or higher are returned, sorted by
        matchingScore descending. Seller → buyer matching only; the
        reverse (buyer → seller) direction is not implemented.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Matching buyer inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryMatchListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/public:
    patch:
      tags: [Inquiries]
      summary: Change public visibility
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicVisibilityRequest'
      responses:
        '200':
          description: Updated inquiry

  /public/properties:
    get:
      tags: [Public Properties]
      summary: List publicly approved properties
      description: |
        Returns properties where isPublic=true AND status=AVAILABLE.
        isPublic alone is not sufficient — a property marked isPublic but
        no longer AVAILABLE (e.g. SOLD) is not returned. Unauthenticated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Public properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPropertyListResponse'

components:

  securitySchemes:
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

    masterBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    AttachmentType:
      type: string
      enum:
        - PHOTO
        - DOCUMENT
        - RECORDING

    DocumentType:
      type: string
      enum:
        - SEVEN_TWELVE
        - SALE_DEED
        - PROPERTY_CARD
        - NOC
        - OTHER

    PropertyCategory:
      type: string
      enum:
        - RESIDENTIAL
        - INDUSTRIAL
        - COMMERCIAL
        - AGRICULTURAL

    PropertyStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD
        - ON_HOLD
        - INACTIVE

    InquiryStatus:
      type: string
      enum:
        - NEW
        - IN_PROGRESS
        - ON_HOLD
        - COMPLETED
        - CANCELLED

    InquiryPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - URGENT

    InquiryType:
      type: string
      description: |
        BUYER = a customer looking to purchase; SELLER = a customer
        looking to sell the associated property. Introduced in Phase 11
        to replace the prior free-text `type` field, for buyer/property
        matching (GET /inquiries/{inquiryId}/matches).
      enum:
        - BUYER
        - SELLER

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: EMP001
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, user]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'

    MasterLoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, tokenScope]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            tokenScope:
              type: string
              example: MASTER
            expiresIn:
              type: integer
              example: 3600

    CreateApplicationUserRequest:
      type: object
      required: [name, mobile, password, role]
      properties:
        userId:
          type: string
          example: EMP001
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string

    Customer:
      type: object
      description: |
        Matches the actual response of CustomersService/customer.mapper.ts
        exactly (a distinct shape from User — passwordHash, userId, and
        role never apply to a CUSTOMER and are not part of this schema).
      required: [id, userType, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userType:
          type: string
          enum: [CUSTOMER]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        alternateMobile:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Customer'

    CustomerListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/Pagination'

    User:
      type: object
      required: [id, userType, name, status]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          nullable: true
        userType:
          type: string
          enum: [APPLICATION_USER, CUSTOMER, MASTER]
        role:
          type: string
          nullable: true
          enum: [ADMIN, EMPLOYEE]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreatePropertyRequest:
      type: object
      required: [propertyType, category]
      properties:
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
