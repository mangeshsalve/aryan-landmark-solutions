        isPublic:
          type: boolean

    Inquiry:
      type: object
      required: [id, inquiryNumber, customerId, priority, status, isPublic]
      properties:
        id:
          type: string
          format: uuid
        inquiryNumber:
          type: string
        customerId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/InquiryType'
          nullable: true
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
          nullable: true
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string
          nullable: true
        isPublic:
          type: boolean
        preferredCity:
          type: string
          nullable: true
          description: BUYER matching preference — the city the buyer wants to purchase in.
        preferredPincode:
          type: string
          nullable: true
          description: BUYER matching preference — the exact pincode the buyer wants to purchase in.
        maxBudget:
          type: number
          nullable: true
          description: BUYER matching preference — maximum price the buyer is willing to pay.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            NULL until the inquiry has been submitted via
            POST /inquiries/{inquiryId}/submit. Never settable through
