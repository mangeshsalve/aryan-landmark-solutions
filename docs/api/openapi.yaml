      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'

    InquiryMatch:
      type: object
      description: |
        A BUYER inquiry that scored at least 70 against the SELLER
        inquiry's associated property (Phase 11). Weights: location 50%,
        pincode 30%, budget 20%.
      required: [inquiryId, customerId, customerName, matchingScore]
      properties:
        inquiryId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        customerMobile:
          type: string
          nullable: true
        preferredCity:
          type: string
          nullable: true
        preferredPincode:
          type: string
          nullable: true
        maxBudget:
          type: number
          nullable: true
        matchingScore:
          type: integer
          minimum: 70
          maximum: 100
          description: locationScore (0 or 50) + pincodeScore (0 or 30) + budgetScore (0 or 20)

    InquiryMatchListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/InquiryMatch'
          description: Sorted by matchingScore descending. Only scores >= 70 are included.

    PublicPhoto:
      type: object
      required: [id, fileUrl, isPrimary, displayOrder]
      description: |
        A PHOTO attachment as exposed to public visitors — deliberately a
        narrower shape than Attachment: no r2Bucket/r2ObjectKey (internal
        storage details) and no uploadedBy (employee information).
      properties:
        id:
          type: string
          format: uuid
        fileUrl:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        displayOrder:
          type: integer

    PublicProperty:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/PublicPhoto'

    PublicPropertyListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicProperty'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
        requestId:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
