            - type: object
              properties:
                customer:
                  $ref: '#/components/schemas/User'
                property:
                  $ref: '#/components/schemas/Property'
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'

    InquiryListResponse:
      type: object
