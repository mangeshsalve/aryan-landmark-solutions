      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Inquiry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Assignment:
      type: object
      required: [id, inquiryId, assignedToUserId, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        inquiryId:
