openapi: 3.0.3

info:
  title: Aryan Landmark Solutions API
  version: 1.0.0
  description: |
    Production REST API for Aryan Landmark Solutions.

    PostgreSQL contains six tables. All property photos, property documents
    and inquiry call recordings use one unified `attachments` resource.

    Cloudflare R2 stores file binaries. PostgreSQL stores metadata and the R2
    object key.

servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Authentication
  - name: Master Authentication
  - name: Master Management
  - name: Users
  - name: Customers
  - name: Properties
  - name: Attachments
  - name: Inquiries
  - name: Inquiry Assignments
  - name: Follow-ups
  - name: Notifications
  - name: Public Properties

paths:

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login ADMIN or EMPLOYEE
      description: |
        `username` is users.user_id.

        CUSTOMER and MASTER cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /master-auth/login:
    post:
      tags: [Master Authentication]
      summary: Login Master Record Management
      description: |
        MASTER is manually provisioned in the users table.
        There is no public master-registration endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Master login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /master/users:
    get:
      tags: [Master Management]
      summary: List ADMIN/EMPLOYEE users (Master Admin user management)
      description: |
        Phase 15A. Same query semantics as GET /users (page, pageSize,
        role, status, search — all optional) reachable under the
        master-JWT boundary, so a MASTER account (which cannot hold an
        application JWT) can still list users for the Master Admin UI.
      security:
        - masterBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, EMPLOYEE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Master Management]
      summary: Create ADMIN or EMPLOYEE
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /master/users/{id}:
    patch:
      tags: [Master Management]
      summary: Edit an ADMIN/EMPLOYEE, incl. activate/deactivate and role change
      description: |
        Phase 15A. MASTER-only. Scoped to userType=APPLICATION_USER rows
        only — a MASTER can never edit its own or another MASTER's row,
        or any CUSTOMER row, through this endpoint. All fields optional
        (partial update). See UpdateApplicationUserRequest for the
        role/status take-effect-on-next-login caveat.
      security:
        - masterBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /master/customers:
    post:
      tags: [Master Management]
      summary: Create CUSTOMER master record
      security:
        - masterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users:
    get:
      tags: [Users]
      summary: List application users
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, EMPLOYEE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Matches against name, mobile, or email
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'

    post:
      tags: [Customers]
      summary: Create customer
      description: |
        Creates a customer master record (users.user_type = CUSTOMER).
        Available to ADMIN and EMPLOYEE application users. createdBy is
        derived from the authenticated JWT, never accepted from the
        request body.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer details
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Customers]
      summary: Delete customer
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Blocked with 409
        if any inquiry references this customer
        (inquiries.customer_id is ON DELETE RESTRICT at the database
        level — this is not a new rule, it predates lightweight
        inquiries). A customer with no inquiries can always be deleted.
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Customer deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One or more inquiries reference this customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /properties:
    get:
      tags: [Properties]
      summary: List properties
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'

    post:
      tags: [Properties]
      summary: Create property
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /properties/{propertyId}:
    get:
      tags: [Properties]
      summary: Get property
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'

    patch:
      tags: [Properties]
      summary: Update property
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

    delete:
      tags: [Properties]
      summary: Delete property
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Never blocked by
        inquiries: inquiries.property_id is ON DELETE SET NULL at the
        database level (predates this phase), so any inquiry referencing
        this property simply loses that link and falls back to the same
        "no property yet" state a lightweight inquiry (Phase 13B) starts
        in — nothing breaks. Property-linked attachments are removed
        first, individually (including their R2 objects), through the
        same path DELETE /attachments/{attachmentId} uses.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '204':
          description: Property deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attachments/upload-url:
    post:
      tags: [Attachments]
      summary: Create a short-lived Cloudflare R2 upload authorization
      description: |
        Unified file upload endpoint.

        Use `attachmentType=PHOTO` for property or inquiry photos,
        `attachmentType=DOCUMENT` for 7/12 and other property/inquiry
        documents, `attachmentType=RECORDING` for inquiry call recordings.

        Relationship rules:
        - RECORDING: inquiryId required, propertyId must be absent.
        - PHOTO / DOCUMENT: exactly one of propertyId or inquiryId is
          required (never both). propertyId is the original property-photo
          flow; inquiryId supports the lightweight ADMIN-call-capture flow
          (Phase 13B) where photos/documents are gathered before a
          property record exists.

        The backend validates resource ownership/authorization and returns
        a short-lived upload URL and generated R2 object key.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachmentUploadRequest'
      responses:
        '200':
          description: R2 upload authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: File too large

  /attachments:
    post:
      tags: [Attachments]
      summary: Finalize an uploaded attachment
      description: |
        The client calls this endpoint after uploading the binary to R2.

        The backend verifies the expected object and creates one row in the
        `attachments` table. Same propertyId/inquiryId relationship rules
        as POST /attachments/upload-url.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAttachmentRequest'
      responses:
        '201':
          description: Attachment metadata created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Attachments]
      summary: List attachments
      description: |
        Filter by propertyId, inquiryId and attachmentType.
      security:
        - applicationBearer: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
        - name: inquiryId
          in: query
          schema:
            type: string
            format: uuid
        - name: attachmentType
          in: query
          schema:
            $ref: '#/components/schemas/AttachmentType'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'

  /attachments/{attachmentId}:
    delete:
      tags: [Attachments]
      summary: Delete attachment
      description: |
        Deletes the attachment metadata and performs the corresponding
        authorized Cloudflare R2 object deletion.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries:
    get:
      tags: [Inquiries]
      summary: List inquiries
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/InquiryPriority'
        - name: assignedToUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: handledByUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryListResponse'

    post:
      tags: [Inquiries]
      summary: Create inquiry
      description: |
        Creator is derived from the authenticated JWT.

        customerId/propertyId are optional (Phase 13B): an ADMIN taking a
        call can create a lightweight inquiry (customerId=null,
        propertyId=null, type=null, status=NEW) before either master
        record has been identified — see the inquiry-centric attachment
        capture flow below.

        ADMIN:
        At least one RECORDING attachment associated with this inquiry is
        required before submission (POST /inquiries/{inquiryId}/submit) is
        allowed. Since a RECORDING requires inquiryId, the inquiry must
        already exist — record it via POST /attachments/upload-url +
        POST /attachments against the created inquiryId, then assign an
        EMPLOYEE.

        EMPLOYEE:
        Recording is optional.

        The client must not send a creator role for authorization.
      security:
        - applicationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryRequest'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /inquiries/{inquiryId}:
    get:
      tags: [Inquiries]
      summary: Get inquiry details
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'

    patch:
      tags: [Inquiries]
      summary: Update inquiry
      description: |
        Phase 18A authorization: ADMIN may edit any inquiry. EMPLOYEE may
        edit only the inquiry currently assigned to them
        (inquiries.assigned_to_user_id = the caller's user id, checked
        live — never from assignment history), and is rejected with 403
        otherwise. Viewing (GET) is unaffected — this restriction applies
        to PATCH only.

        Reassigning via this endpoint (assignedToUserId different from
        the current value) also sets handledByUserId to the same user,
        records an inquiry_assignments history row, and — if the caller
        is an ADMIN — creates an in-app notification for the newly
        assigned employee, same as POST /inquiries/{inquiryId}/assign.
        Outside of a reassignment, handledByUserId may still be set
        independently.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInquiryRequest'
      responses:
        '200':
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '403':
          description: EMPLOYEE attempted to edit an inquiry not currently assigned to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Inquiries]
      summary: Delete inquiry
      description: |
        Phase 18A. ADMIN only — EMPLOYEE receives 403. Deletes the
        inquiry and, via ON DELETE CASCADE, its attachments, assignment
        history, and follow-ups. Attachment R2 objects are removed
        first, individually, through the same path DELETE
        /attachments/{attachmentId} uses, so no object is left behind in
        storage. A deleted inquiry's follow-ups are removed from the
        database entirely — they can never appear in
        GET /follow-ups/today afterward.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '204':
          description: Inquiry deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/submit:
    post:
      tags: [Inquiries]
      summary: Submit an inquiry
      description: |
        Submit an existing inquiry after validating that all mandatory
        requirements are satisfied.

        Sets inquiries.submitted_at to the current time. Fails with a
        conflict if the inquiry has already been submitted
        (submitted_at is already set).

        If the inquiry's creator (created_by) is an ADMIN, at least one
        RECORDING attachment for this inquiry is required, or the
        request is rejected. If the creator is an EMPLOYEE, the
        recording is optional. The creator's role is read from the
        inquiry's created_by user, not from the caller submitting it —
        an EMPLOYEE may submit an ADMIN-created inquiry and the ADMIN
        recording requirement still applies, and vice versa.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: ADMIN inquiry submitted without a required recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries/{inquiryId}/assign:
    post:
      tags: [Inquiry Assignments]
      summary: Assign or reassign inquiry
      description: |
        Updates inquiries.assigned_to_user_id AND
        inquiries.handled_by_user_id (Phase 18A — both point at the
        newly assigned user), and inserts an inquiry_assignments history
        row, in one database transaction.

        Phase 23A authorization: ADMIN may assign/reassign any inquiry.
        EMPLOYEE may assign/reassign only the inquiry currently assigned
        to them (inquiries.assigned_to_user_id = the caller's user id,
        checked live — never from assignment history), and is rejected
        with 403 otherwise — same rule as PATCH /inquiries/{inquiryId}.
        An unassigned inquiry (assigned_to_user_id = null) is therefore
        also not takeable by an EMPLOYEE through this endpoint.

        If the caller is an ADMIN, the newly assigned employee receives
        an in-app notification (GET /notifications). If the caller is an
        EMPLOYEE, no notification is created — the assignment itself
        still succeeds identically either way; this is purely an
        additive side effect, never a precondition.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInquiryRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryDetailResponse'
        '403':
          description: EMPLOYEE attempted to assign/reassign an inquiry not currently assigned to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inquiries/{inquiryId}/assignments:
    get:
      tags: [Inquiry Assignments]
      summary: Get assignment history
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'

  /inquiries/{inquiryId}/matches:
    get:
      tags: [Inquiries]
      summary: Find matching inquiries (bidirectional)
      description: |
        Phase 11 buyer/property matching foundation; bidirectional as of
        Phase 19A; unified Inquiry.city/state/pincode/locality (replacing
        the old BUYER-only preferredCity/preferredPincode) as of this
        phase, with normalized city matching and fuzzy locality matching
        (city is NOT fuzzy — see the criteria breakdown below). Which
        direction runs depends on the path inquiry's own type:

        - type=SELLER → returns matching BUYER inquiries.
        - type=BUYER → returns matching SELLER inquiries.
        - any other type (including a lightweight inquiry with type=null)
          → 400.

        Both directions now score identically and symmetrically — both
        sides read city/state/pincode/locality directly from their own
        Inquiry row (a SELLER inquiry's location is kept in sync with its
        linked Property; see the Inquiry schema description). Only
        price/budget stays asymmetric: a SELLER's price always comes from
        its linked Property, a BUYER's from its own maxBudget.

          pincode  (30%): MANDATORY exact match after normalization
                          (trimmed). No match ⇒ zero results — this is a
                          hard gate, not merely a scored criterion.
          location (50%): MAX(cityScore, localityScore) — not summed.
                          - city: normalized (trimmed, lowercased,
                            punctuation-stripped) exact compare, not raw
                            string equality.
                          - locality: token-overlap fuzzy match on the
                            same normalization, with short/numeric/generic
                            words (road, colony, highway, ...) filtered
                            out so they alone can't drive a false-positive
                            match.
          budget   (20%): the SELLER side's property price <= the BUYER
                          side's maxBudget. Unchanged this phase.

        Only candidates scoring 70 or higher are returned, sorted by
        matchingScore descending. The source inquiry never appears in its
        own results.

        Achievable score values (documentation only — a mathematical
        consequence of the weights above, not a separate rule, and the
        70 threshold itself is unchanged): pincode is all-or-nothing to
        even reach scoring (30 once gated), location is 0 or 50, budget
        is 0 or 20 — so a gated candidate can only ever total 30, 50, 80,
        or 100. Since 80 is the smallest of those that clears 70, the
        *effective* minimum passing score today is 80 (pincode plus
        budget alone, at 50, is never enough — the location criterion
        must also match).

        Status is NOT checked — a NEW, IN_PROGRESS, or COMPLETED inquiry
        may all use matching; COMPLETED was never actually required by
        this endpoint.

        Insufficient data: a SELLER inquiry with no propertyId is a 400
        (there is no price to match against). Any source with no pincode
        yet returns an empty array, not an error — the field may simply
        not be filled in. No fabricated matches are ever returned.

        Limitation: property area/category/propertyType are NOT used as
        matching criteria — there is no corresponding "desired
        area/category/propertyType" field on a BUYER inquiry to compare
        against, and none was added in this phase.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Matching buyer inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryMatchListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/public:
    patch:
      tags: [Inquiries]
      summary: Change public visibility
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicVisibilityRequest'
      responses:
        '200':
          description: Updated inquiry

  /inquiries/{inquiryId}/follow-ups:
    get:
      tags: [Follow-ups]
      summary: List follow-ups for an inquiry
      description: |
        Phase 16A. Chronological (scheduledAt ascending) — matches the
        Inquiry Details screen's Follow-ups section.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Follow-ups for this inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Follow-ups]
      summary: Create a follow-up for an inquiry
      description: |
        Phase 16A. Works for a lightweight inquiry (customerId=null,
        propertyId=null, type=null) exactly the same as a fully completed
        one — a follow-up only ever requires the inquiry to exist.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFollowUpRequest'
      responses:
        '201':
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inquiries/{inquiryId}/follow-ups/{followUpId}:
    patch:
      tags: [Follow-ups]
      summary: Update a follow-up, incl. completing it
      description: |
        Phase 16A. All fields optional. Setting status=COMPLETED is how a
        follow-up is marked complete — there is no separate "complete"
        endpoint, since (unlike inquiry submission) there is no extra
        precondition to enforce.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/FollowUpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFollowUpRequest'
      responses:
        '200':
          description: Follow-up updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Follow-ups]
      summary: Delete a follow-up
      description: |
        Phase 22B. ADMIN and EMPLOYEE both allowed — same authorization as
        create/update above (no per-assignment ownership restriction).
        Hard delete: the follow_ups row is permanently removed. Before
        deletion, an audit_logs entry is written recording who deleted it,
        when, and a snapshot of the deleted follow-up's data (id,
        inquiryId, scheduledAt, status, notes, reminderEnabled) — both
        writes happen inside a single database transaction, so a follow-up
        is never deleted without its audit record, and an audit record
        never claims a deletion that didn't happen.

        followUpId must belong to the inquiry named in the path — a
        followUpId that exists but under a different inquiryId returns
        404, identical to a followUpId that doesn't exist at all.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/InquiryId'
        - $ref: '#/components/parameters/FollowUpId'
      responses:
        '204':
          description: Follow-up deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /follow-ups/today:
    get:
      tags: [Follow-ups]
      summary: Today's follow-ups (dashboard)
      description: |
        Phase 16A Part 6. "Today" is computed in the business's IST
        (Asia/Kolkata, UTC+5:30) timezone as a real UTC instant range, not
        a string comparison — see the backend's today-range.util.ts for
        the flagged assumption (no documented business timezone exists
        elsewhere in this project). Not paginated — "today" is a small,
        naturally bounded set. Each entry embeds a minimal Inquiry
        summary (id, inquiryNumber, status) and a minimal customer
        summary (id, name) which is null for a lightweight inquiry that
        has no customer yet.
      security:
        - applicationBearer: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FollowUpStatus'
      responses:
        '200':
          description: Follow-ups scheduled for today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayFollowUpListResponse'

  /notifications:
    get:
      tags: [Notifications]
      summary: List the caller's own notifications
      description: |
        Always scoped to the authenticated caller — there is no way to
        list another user's notifications. No POST: notifications are
        always created as a side effect of a real business action (e.g.
        an ADMIN assigning an inquiry), never directly by a client.
      security:
        - applicationBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isRead
          in: query
          description: Filter to only read (true) or only unread (false) notifications.
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/{id}:
    patch:
      tags: [Notifications]
      summary: Update a notification (mark read/unread)
      description: |
        Scoped to the caller's own notifications — a notification id
        belonging to another user returns 404, never leaking whether it
        exists.
      security:
        - applicationBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/properties:
    get:
      tags: [Public Properties]
      summary: List publicly approved properties
      description: |
        Returns properties where isPublic=true AND status=AVAILABLE.
        isPublic alone is not sufficient — a property marked isPublic but
        no longer AVAILABLE (e.g. SOLD) is not returned. Unauthenticated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/PropertyCategory'
        - name: city
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Public properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPropertyListResponse'

components:

  securitySchemes:
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

    masterBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FollowUpId:
      name: followUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    AttachmentType:
      type: string
      enum:
        - PHOTO
        - DOCUMENT
        - RECORDING

    DocumentType:
      type: string
      enum:
        - SEVEN_TWELVE
        - SALE_DEED
        - PROPERTY_CARD
        - NOC
        - OTHER

    PropertyCategory:
      type: string
      enum:
        - RESIDENTIAL
        - INDUSTRIAL
        - COMMERCIAL
        - AGRICULTURAL

    PropertyStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD
        - ON_HOLD
        - INACTIVE

    PropertyAreaUnit:
      type: string
      description: |
        Controlled list — was free-text before, with inconsistent
        real-world values ('SQ.FT'/'sq.ft'/'SQ FT'), now normalized.
        SQ_FT/SQ_YD/SQ_M for residential/commercial-scale listings;
        ACRE/GUNTHA/HECTARE for agricultural land. SQ_YD/SQ_M added later
        as a purely additive change (Postgres ALTER TYPE ... ADD VALUE),
        matching Flutter's six-value area-unit picker.
      enum:
        - SQ_FT
        - SQ_YD
        - SQ_M
        - ACRE
        - GUNTHA
        - HECTARE

    InquiryStatus:
      type: string
      enum:
        - NEW
        - IN_PROGRESS
        - ON_HOLD
        - COMPLETED
        - CANCELLED

    InquiryPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - URGENT

    InquiryType:
      type: string
      description: |
        BUYER = a customer looking to purchase; SELLER = a customer
        looking to sell the associated property. Introduced in Phase 11
        to replace the prior free-text `type` field, for buyer/property
        matching (GET /inquiries/{inquiryId}/matches).
      enum:
        - BUYER
        - SELLER

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: EMP001
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, user]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'

    MasterLoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [accessToken, tokenScope]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              example: Bearer
            tokenScope:
              type: string
              example: MASTER
            expiresIn:
              type: integer
              example: 3600

    CreateApplicationUserRequest:
      type: object
      required: [name, mobile, password, role]
      properties:
        userId:
          type: string
          example: EMP001
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]

    UpdateApplicationUserRequest:
      type: object
      description: |
        Phase 15A — MASTER-only partial update of an ADMIN/EMPLOYEE.
        Everything optional. Excludes userId (stable business identifier)
        and password (password change is not part of this endpoint — no
        password-reset flow exists yet). role stays restricted to
        ADMIN/EMPLOYEE — MASTER can never be assigned here either.

        A role or status change takes effect for future logins only: an
        already-issued JWT keeps its original role/status claims until it
        expires (up to 1 hour) or the user logs in again — there is no
        token revocation mechanism in this project.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        role:
          type: string
          enum: [ADMIN, EMPLOYEE]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
          description: |
            ACTIVE users can log in; INACTIVE/BLOCKED are rejected at
            POST /auth/login (existing behavior, unchanged by this
            phase) but a currently-held JWT is not revoked immediately.

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        alternateMobile:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string

    Customer:
      type: object
      description: |
        Matches the actual response of CustomersService/customer.mapper.ts
        exactly (a distinct shape from User — passwordHash, userId, and
        role never apply to a CUSTOMER and are not part of this schema).
      required: [id, userType, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userType:
          type: string
          enum: [CUSTOMER]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        alternateMobile:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Customer'

    CustomerListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/Pagination'

    User:
      type: object
      required: [id, userType, name, status]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          nullable: true
        userType:
          type: string
          enum: [APPLICATION_USER, CUSTOMER, MASTER]
        role:
          type: string
          nullable: true
          enum: [ADMIN, EMPLOYEE]
        name:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]

    UserSummary:
      type: object
      required: [id, name]
      description: |
        Minimal, embeddable display identity for a user (Phase 14A) — id
        and name only. Deliberately does not carry email/mobile/role/
        status/userId; unlike User above, it's for label-only embedding
        (e.g. Inquiry.handledBy/assignedTo), never for anything requiring
        the full user record.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreatePropertyRequest:
      type: object
      required: [propertyType, category]
      description: |
        priceUnit is not part of this request (this phase) — this
        application is India-only, price is always INR, applied
        server-side; it is not client-settable. mapUrl accepts any valid
        URL (e.g. a Google Maps shareable location link produced by
        Flutter's own map picker) — no Google Maps API integration or key
        exists or is required on the backend for this.
      properties:
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        area:
          type: number
          minimum: 0
        areaUnit:
          $ref: '#/components/schemas/PropertyAreaUnit'
        price:
          type: number
          minimum: 0
        gatNoDetails:
          type: string
        description:
          type: string
        address:
          type: string
        locality:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        mapUrl:
          type: string
          format: uri
          description: |
            A shareable location URL (e.g. from Google Maps) selected via
            Flutter's own map picker. Validated as a well-formed URL only
            — not verified against any Maps API.

    UpdatePropertyRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePropertyRequest'
      properties:
        status:
          $ref: '#/components/schemas/PropertyStatus'
        isPublic:
          type: boolean
          description: |
            Controls whether this property appears in
            GET /public/properties (also requires status=AVAILABLE).
            ADMIN only — an EMPLOYEE-authenticated request that includes
            this field is rejected.

    Property:
      type: object
      required: [id, propertyCode, propertyType, category, status, isPublic]
      properties:
        id:
          type: string
          format: uuid
        propertyCode:
          type: string
        propertyType:
          type: string
        category:
          $ref: '#/components/schemas/PropertyCategory'
        area:
          type: number
          nullable: true
        areaUnit:
          allOf:
            - $ref: '#/components/schemas/PropertyAreaUnit'
          nullable: true
        price:
          type: number
          nullable: true
        priceUnit:
          type: string
          nullable: true
          description: |
            Always "INR" in practice (this application is India-only) —
            not client-settable via CreatePropertyRequest/
            UpdatePropertyRequest (this phase). Kept in the response for
            backward compatibility with existing clients reading it; the
            database column and value are both retained, only the
            request contract changed.
        gatNoDetails:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        mapUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PropertyStatus'
        isPublic:
          type: boolean

    PropertyResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Property'

    PropertyDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Property'
            - type: object
              properties:
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'

    PropertyListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateAttachmentUploadRequest:
      type: object
      required:
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
      properties:
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for PHOTO/DOCUMENT unless inquiryId is set instead
            (mutually exclusive). Must be absent for RECORDING.
        inquiryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for RECORDING. For PHOTO/DOCUMENT, may be used
            instead of propertyId during lightweight inquiry capture
            (Phase 13B) — mutually exclusive with propertyId.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        isPrimary:
          type: boolean
          default: false

    FinalizeAttachmentRequest:
      type: object
      required:
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
        - r2ObjectKey
      properties:
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for PHOTO/DOCUMENT unless inquiryId is set instead
            (mutually exclusive). Must be absent for RECORDING.
        inquiryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Required for RECORDING. For PHOTO/DOCUMENT, may be used
            instead of propertyId during lightweight inquiry capture
            (Phase 13B) — mutually exclusive with propertyId.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        r2ObjectKey:
          type: string
        isPrimary:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 0

    Attachment:
      type: object
      required:
        - id
        - attachmentType
        - fileName
        - mimeType
        - fileSizeBytes
        - r2ObjectKey
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        inquiryId:
          type: string
          format: uuid
          nullable: true
        attachmentType:
          $ref: '#/components/schemas/AttachmentType'
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          description: Attachment size in bytes.
        r2Bucket:
          type: string
        r2ObjectKey:
          type: string
        fileUrl:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AttachmentResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Attachment'

    AttachmentListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    UploadUrlResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [uploadUrl, r2ObjectKey, expiresIn]
          properties:
            uploadUrl:
              type: string
              format: uri
            r2ObjectKey:
              type: string
            expiresIn:
              type: integer
              example: 900

    CreateInquiryRequest:
      type: object
      description: |
        customerId and propertyId are both optional (Phase 13B) — an
        ADMIN taking a call can create a lightweight inquiry
        (customerId=null, propertyId=null, type=null, status=NEW) before
        either master record has been identified, then attach a
        recording/photos/documents against the returned inquiryId and
        assign an EMPLOYEE. The EMPLOYEE later identifies/creates the
        customer and property via PATCH /inquiries/{inquiryId}.
      properties:
        customerId:
          type: string
          format: uuid
          nullable: true
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/InquiryType'
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string
        city:
          type: string
          description: |
            Unified location field (this phase), used by both BUYER and SELLER.
            For a SELLER inquiry with propertyId set, ignored and overridden by
            the linked property's own city.
        state:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        pincode:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        locality:
          type: string
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal alongside
            city. Same SELLER-sync override rule as city (synced from
            Property.locality, never Property.address).
        maxBudget:
          type: number
          minimum: 0
          description: BUYER matching preference — maximum price the buyer is willing to pay.

    UpdateInquiryRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/InquiryType'
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
        handledByUserId:
          type: string
          format: uuid
        assignedToUserId:
          type: string
          format: uuid
        remarks:
          type: string
        city:
          type: string
          description: |
            Unified location field (this phase), used by both BUYER and SELLER.
            For a SELLER inquiry, ignored/overridden whenever propertyId changes
            in the same request.
        state:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        pincode:
          type: string
          description: Unified location field (this phase). Same SELLER-sync override rule as city.
        locality:
          type: string
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal alongside
            city. Same SELLER-sync override rule as city.
        maxBudget:
          type: number
          minimum: 0
          description: BUYER matching preference — maximum price the buyer is willing to pay.

    AssignInquiryRequest:
      type: object
      required: [assignedToUserId]
      properties:
        assignedToUserId:
          type: string
          format: uuid
        reason:
          type: string

    PublicVisibilityRequest:
      type: object
      required: [isPublic]
      properties:
        isPublic:
          type: boolean

    Inquiry:
      type: object
      required: [id, inquiryNumber, customerId, customerName, priority, status, isPublic]
      properties:
        id:
          type: string
          format: uuid
        inquiryNumber:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
          description: |
            NULL for a lightweight inquiry (Phase 13B) until an EMPLOYEE
            sets it via PATCH /inquiries/{inquiryId}.
        customerName:
          type: string
          nullable: true
          description: |
            This phase — the linked customer's display name, straight
            from GET /inquiries (no extra GET /customers/{id} request
            needed). Null exactly when customerId is null. Fetched via
            the same single relation-include as handledBy/assignedTo, so
            listing a page of inquiries costs one query, not one per row.
        propertyId:
          type: string
          format: uuid
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/InquiryType'
          nullable: true
        priority:
          $ref: '#/components/schemas/InquiryPriority'
        status:
          $ref: '#/components/schemas/InquiryStatus'
        externalReference:
          type: string
          nullable: true
        handledByUserId:
          type: string
          format: uuid
          nullable: true
        handledBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: |
            Minimal display identity for handledByUserId (Phase 14A) — null
            when unassigned. handledByUserId remains the field to use for
            API operations/authorization; this is read-model only.
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        assignedTo:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: |
            Minimal display identity for assignedToUserId (Phase 14A) —
            null when unassigned. assignedToUserId remains the field to use
            for API operations/authorization; this is read-model only.
        remarks:
          type: string
          nullable: true
        isPublic:
          type: boolean
        city:
          type: string
          nullable: true
          description: |
            Unified location field (this phase, replacing the old BUYER-only
            preferredCity), used by both BUYER and SELLER. For a SELLER
            inquiry, kept in sync with the linked property's own city — see
            InquiriesService/PropertiesService for the sync rule; never
            independently editable while a property is linked.
        state:
          type: string
          nullable: true
          description: Unified location field (this phase). Same SELLER-sync rule as city.
        pincode:
          type: string
          nullable: true
          description: |
            Unified location field (this phase, replacing the old BUYER-only
            preferredPincode). Mandatory exact-match gate for matching — see
            GET /inquiries/{inquiryId}/matches.
        locality:
          type: string
          nullable: true
          description: |
            Locality/area text (this phase) — the fuzzy-matching signal
            alongside city. For a SELLER inquiry, synced from
            Property.locality only (never Property.address).
        maxBudget:
          type: number
          nullable: true
          description: BUYER matching preference — maximum price the buyer is willing to pay.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            NULL until the inquiry has been submitted via
            POST /inquiries/{inquiryId}/submit. Never settable through
            create/update requests.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InquiryDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          allOf:
            - $ref: '#/components/schemas/Inquiry'
            - type: object
              properties:
                customer:
                  $ref: '#/components/schemas/User'
                property:
                  $ref: '#/components/schemas/Property'
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'

    InquiryListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Inquiry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Assignment:
      type: object
      description: |
        Phase 18A: assignedFrom/assignedTo added alongside the existing
        *UserId fields (kept for backward compatibility) — minimal
        {id, name} display identity, same UserSummary shape used
        elsewhere (e.g. Inquiry.handledBy/assignedTo). assignedFrom is
        null for the first-ever assignment of an inquiry (nothing to
        reassign from).
      required: [id, inquiryId, assignedToUserId, assignedTo, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        inquiryId:
          type: string
          format: uuid
        assignedFromUserId:
          type: string
          format: uuid
          nullable: true
        assignedFrom:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        assignedToUserId:
          type: string
          format: uuid
        assignedTo:
          $ref: '#/components/schemas/UserSummary'
        assignedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid

    AssignmentListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'

    InquiryMatch:
      type: object
      description: |
        An opposite-type inquiry that scored at least 70 against the
        source inquiry (Phase 11; bidirectional as of Phase 19A; unified
        location fields as of this phase, with normalized city matching
        and fuzzy locality matching — city is NOT fuzzy). For a SELLER
        source, entries are matching BUYER inquiries; for a BUYER
        source, entries are matching SELLER inquiries. Weights: pincode
        30% (mandatory gate), location (MAX of city-normalized-exact and
        locality-fuzzy-token, not summed) 50%, budget 20%. Achievable
        totals are therefore 30/50/80/100 — the 70 threshold is
        unchanged, but 80 is effectively the minimum passing score (see
        the matches endpoint description for the full explanation).

        inquiryType/propertyId are additive (Phase 19A). city/state/
        pincode/locality (this phase, replacing preferredCity/
        preferredPincode) are populated for BOTH match types now —
        unlike the old buyer-only fields, these are meaningful regardless
        of whether the matched entry is BUYER or SELLER, since both sides
        carry their own location directly on the Inquiry row.
      required: [inquiryId, inquiryType, customerId, customerName, matchingScore]
      properties:
        inquiryId:
          type: string
          format: uuid
          description: The matched inquiry's id — use this to navigate to it.
        inquiryType:
          $ref: '#/components/schemas/InquiryType'
          description: Which side this match is (BUYER or SELLER).
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        customerMobile:
          type: string
          nullable: true
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: |
            The matched inquiry's property, if any. Populated for
            inquiryType=SELLER matches (fetch GET /properties/{propertyId}
            for full detail); null for inquiryType=BUYER matches.
        city:
          type: string
          nullable: true
          description: Populated for both inquiryType=BUYER and inquiryType=SELLER matches (this phase).
        state:
          type: string
          nullable: true
          description: Populated for both inquiryType=BUYER and inquiryType=SELLER matches (this phase).
        pincode:
          type: string
          nullable: true
          description: Populated for both inquiryType=BUYER and inquiryType=SELLER matches (this phase).
        locality:
          type: string
          nullable: true
          description: Populated for both inquiryType=BUYER and inquiryType=SELLER matches (this phase).
        maxBudget:
          type: number
          nullable: true
          description: Null for inquiryType=SELLER matches (a buyer-preference field, unchanged this phase).
        matchingScore:
          type: integer
          minimum: 70
          maximum: 100
          description: locationScore (0 or 50) + pincodeScore (0 or 30) + budgetScore (0 or 20)

    InquiryMatchListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/InquiryMatch'
          description: Sorted by matchingScore descending. Only scores >= 70 are included.

    FollowUpStatus:
      type: string
      enum: [PENDING, COMPLETED]
      description: |
        Phase 16A — matches the old web UI exactly. Deliberately just
        these two; no CANCELLED/MISSED/RESCHEDULED/OVERDUE.

    CreateFollowUpRequest:
      type: object
      required: [scheduledAt]
      description: |
        No inquiryId — taken from the URL path. scheduledAt is a single
        ISO-8601 date-time (the old UI's separate Date/Time fields are
        combined client-side before sending).
      properties:
        scheduledAt:
          type: string
          format: date-time
        status:
          allOf:
            - $ref: '#/components/schemas/FollowUpStatus'
          default: PENDING
        notes:
          type: string
        reminderEnabled:
          type: boolean
          default: false

    UpdateFollowUpRequest:
      type: object
      description: |
        Everything from CreateFollowUpRequest, all optional. Setting
        status=COMPLETED is how a follow-up is completed — no separate
        endpoint.
      properties:
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FollowUpStatus'
        notes:
          type: string
        reminderEnabled:
          type: boolean

    FollowUp:
      type: object
      required:
        - id
        - inquiryId
        - scheduledAt
        - status
        - reminderEnabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        inquiryId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FollowUpStatus'
        notes:
          type: string
          nullable: true
        reminderEnabled:
          type: boolean
          description: |
            Persisted as business data only (Phase 16A) — no push/email/
            SMS/local notification is sent when this is true. Flutter
            reads it to show a reminder indicator.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FollowUpResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/FollowUp'

    FollowUpListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/FollowUp'

    TodayFollowUp:
      type: object
      description: |
        FollowUp plus a minimal embedded inquiry summary — deliberately
        not the full Inquiry/User schemas (Phase 16A Part 8). customer is
        null for a lightweight inquiry that has no customer yet.
      allOf:
        - $ref: '#/components/schemas/FollowUp'
        - type: object
          required: [inquiry]
          properties:
            inquiry:
              type: object
              required: [id, inquiryNumber, status, customer]
              properties:
                id:
                  type: string
                  format: uuid
                inquiryNumber:
                  type: string
                status:
                  $ref: '#/components/schemas/InquiryStatus'
                customer:
                  type: object
                  nullable: true
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string

    TodayFollowUpListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TodayFollowUp'

    Notification:
      type: object
      description: |
        In-app notification (this phase). Currently produced only when an
        ADMIN assigns/reassigns an inquiry to an employee (type=
        INQUIRY_ASSIGNED) — employee-initiated assignment does not
        produce one, by design (see POST /inquiries/{inquiryId}/assign).
        Generic on purpose (same entityType/entityId/free-text-type shape
        as internal audit events) so a future notification type doesn't
        need a contract change.
      required: [id, type, title, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: INQUIRY_ASSIGNED
        title:
          type: string
        message:
          type: string
        entityType:
          type: string
          nullable: true
          example: INQUIRY
        entityId:
          type: string
          format: uuid
          nullable: true
          description: With entityType=INQUIRY, the inquiry to navigate to.
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'

    NotificationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Notification'

    UpdateNotificationRequest:
      type: object
      description: The only supported change is marking a notification read/unread.
      properties:
        isRead:
          type: boolean

    PublicPhoto:
      type: object
      required: [id, fileUrl, isPrimary, displayOrder]
      description: |
        A PHOTO attachment as exposed to public visitors — deliberately a
        narrower shape than Attachment: no r2Bucket/r2ObjectKey (internal
        storage details) and no uploadedBy (employee information).
      properties:
        id:
          type: string
          format: uuid
        fileUrl:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        displayOrder:
          type: integer

    PublicProperty:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/PublicPhoto'

    PublicPropertyListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicProperty'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
        requestId:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
